name: Tests

# Required checks: main is protected, so all six jobs must pass before anything merges. Pages publishes main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and every system library they need, so no job
    # runs apt (apt install-deps used to hang on the runner's dpkg lock and time out at 12 min, BB-60).
    # The tag must match playwright-core in package-lock.json, or the browsers won't be found.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chrome
          - desktop-safari
          - iphone-16-safari
          - iphone-16-pro-max-safari
          - iphone-16-chrome
          - iphone-17-pro-max-safari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Exact versions from package-lock.json: a new Playwright or axe release can't change CI on its own.
      - run: npm ci --no-audit --no-fund
      # Fails fast with a clear message if package-lock.json moved to another Playwright than the image.
      - name: Check Playwright matches the image
        run: |
          want=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          grep -q "mcr.microsoft.com/playwright:v$want-" .github/workflows/tests.yml || { echo "::error::package-lock.json has Playwright $want: set the container image in tests.yml to v$want"; exit 1; }
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
