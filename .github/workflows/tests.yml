name: Tests

# Required checks: main is protected, so all six jobs must pass before anything merges. Pages publishes main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chrome
          - desktop-safari
          - iphone-16-safari
          - iphone-16-pro-max-safari
          - iphone-16-chrome
          - iphone-17-pro-max-safari
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      # System libraries go through apt. Never kill apt mid-run: a killed apt-get leaves the dpkg lock held
      # and every retry then fails with "Could not get lock". Instead, let apt wait for the lock
      # (the runner's own apt jobs can hold it at start-up) and cap the step as a whole.
      - name: Install browser system libraries
        timeout-minutes: 12
        run: |
          echo 'DPkg::Lock::Timeout "600";' | sudo tee /etc/apt/apt.conf.d/99-lock-timeout
          npx playwright install-deps ${{ matrix.project == 'desktop-chrome' && 'chromium' || 'webkit' }}
      # The browser download itself touches no lock, so it is safe to cap and retry.
      - name: Install browser
        run: |
          for i in 1 2 3; do
            timeout 300 npx playwright install ${{ matrix.project == 'desktop-chrome' && 'chromium' || 'webkit' }} && exit 0
            echo "Browser download attempt $i failed or stalled, retrying"
          done
          exit 1
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
