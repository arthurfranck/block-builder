name: Tests

# Required checks: main is protected, so all six jobs must pass before anything merges. Pages publishes main.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # BB-62, BB-66, BB-79, BB-86: type-check the Playwright tests and the page code, lint and format-check it,
  # check the committed bundle matches src/, and fail on high or critical advisories in the dependencies.
  static:
    name: static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type-check tests (strict) and src/ (non-strict)
        run: npm run typecheck
      # BB-79: ESLint (eslint.config.mjs) and Prettier (.prettierrc.json) on the page scripts.
      - name: Lint
        run: npm run lint
      - name: Formatting
        run: npm run format:check
      # BB-86, ADR 0008 step 1: app.js is built from src/ and committed, so it must match a fresh build.
      - name: Bundle matches src/
        run: |
          npm run build
          git diff --exit-code -- app.js app.js.map || { echo "::error::app.js is out of date: run npm run build and commit app.js and app.js.map"; exit 1; }
      - name: Dependency audit (high and critical)
        run: npm audit --audit-level=high

  test:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    # Playwright's own image ships the browsers and every system library they need, so no job
    # runs apt (apt install-deps used to hang on the runner's dpkg lock and time out at 12 min, BB-60).
    # The tag must match playwright-core in package-lock.json, or the browsers won't be found.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --user 1001 --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project:
          - desktop-chrome
          - desktop-safari
          - iphone-16-safari
          - iphone-16-pro-max-safari
          - iphone-16-chrome
          - iphone-17-pro-max-safari
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # Exact versions from package-lock.json: a new Playwright or axe release can't change CI on its own.
      - run: npm ci --no-audit --no-fund
      # Fails fast with a clear message if package-lock.json moved to another Playwright than the image.
      - name: Check Playwright matches the image
        run: |
          want=$(node -p "require('./package-lock.json').packages['node_modules/playwright-core'].version")
          grep -q "mcr.microsoft.com/playwright:v$want-" .github/workflows/tests.yml || { echo "::error::package-lock.json has Playwright $want: set the container image in tests.yml to v$want"; exit 1; }
      - name: "Unit tests (Node): plan engine and safe HTML"
        run: npm run test:engine
      - run: npx playwright test --project=${{ matrix.project }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14
