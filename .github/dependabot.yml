# Weekly update PRs for the test tooling and the CI actions. The six Tests jobs must pass before one merges.
# Note: a Playwright bump also needs the container tag in tests.yml changed to match (the CI check fails until it is).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      test-tooling:
        patterns: ["*"]
    ignore:
      # Types must match the Node the tests run on (22, in CI and locally). Raise this on purpose with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
