/* Layout: sticky setup rail on the left, plan on the right (volume profile, then week x day grid). Stacks on phones. */
:root{
  /* "Night track": dark is the default. Volt accent only on today's run and the primary action. */
  --bg:#0B0F10; --surface:#131A1C; --surface-2:#1B2427; --ink:#ECF1EE; --muted:#97A5A8; --line:#283336;
  --accent:#D4FF3A; --accent-ink:#0B0F10; --accent-btn:#D4FF3A; --accent-line:#D4FF3A;
  --recovery:#7FA6C9; --easy:#4CB98F; --long:#DDBF4F; --tempo:#F0894A; --hard:#EC5A6E; --race:#D879D2;
  --ph-base:#5E8C7C; --ph-build:#5579AE; --ph-peak:#EE7650; --ph-taper:#C9A447; --ph-recovery:#8AA4AE;
  --recovery-t:#7FA6C9; --easy-t:#4CB98F; --long-t:#DDBF4F; --tempo-t:#F0894A; --hard-t:#EC5A6E; --race-t:#D879D2;
  --ph-base-t:#6A9A89; --ph-build-t:#7392C2; --ph-peak-t:#EE7650; --ph-taper-t:#C9A447; --ph-recovery-t:#9DB5BE;

  /* surfaces: page --bg, cards --surface, things inside cards --surface-2; only Today gets --lift */
  --lift:0 14px 36px rgba(0,0,0,.45);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; /* expanded (font-stretch:125%) and heavy: brand and hero numbers only */

  --f-mono:ui-monospace,"SFMono-Regular",Menlo,monospace; /* system font, code samples only */

/* Light theme: chosen in the header, or "Auto" on a device set to light. Volt fails as text on light, so lines use olive. */
:root[data-theme="light"]{
  --bg:#E8EDEB; --surface:#FFFFFF; --surface-2:#F0F4F2; --ink:#142027; --muted:#5A6A6F; --line:#D5DDDB;
  --accent:#D4FF3A; --accent-ink:#142027; --accent-btn:#D4FF3A; --accent-line:#557000;

@media (prefers-color-scheme: light){:root[data-theme="auto"]{

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}

/* phone: Plan / Settings tabs, compact header, 16px fields to stop iOS focus zoom */
.mtabs,.m-only{display:none}
@media (max-width:900px){

let LANG=(()=>{try{const s=localStorage.getItem("bb-lang");if(s==="fr"||s==="en")return s;}catch(_){}return /^fr/i.test(navigator.language||"")?"fr":"en";})();
function t(k,v){let s=(I18N[LANG]&&I18N[LANG][k]);if(s==null)s=I18N.en[k]!=null?I18N.en[k]:k;return v?s.replace(/\{(\w+)\}/g,(m,x)=>v[x]!==undefined?v[x]:m):s;}
const cap=x=>String(x).charAt(0).toUpperCase()+String(x).slice(1);
const LOC=()=>LANG==="fr"?"fr-FR":"en-GB";
let DAYS=t("days").split("|"), DAYS1=t("days1").split("|");
const phaseLbl=p=>t("ph_"+p);
const KINDS_KEYS={easy:"kEasy",recovery:"kRecovery",long:"kLong",hard:"kHard"};
const kindLbl=k=>t(KINDS_KEYS[k]||"kHard");
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const DEFAULT_TYPES = () => TYPE_DEFS.map(([id,kind,on,locked,ph])=>({id,name:t("ty_"+id),kind,on,...(locked?{locked:true}:{}),phases:ph?ph.slice():PHASES.slice(),tpl:t("tp_"+id)}));
function translateTypes(types,from,to){
  for(const ty of types){const id=TYPE_DEFS.some(d=>d[0]===ty.id)?ty.id:"custom";
    if(ty.name===I18N[from]["ty_"+id])ty.name=I18N[to]["ty_"+id];
    if(ty.tpl===I18N[from]["tp_"+id])ty.tpl=I18N[to]["tp_"+id];}
}

function nextSundayWeeks(n){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+((7-d.getDay())%7)+7*n);return iso(d);}

const phaseColor=p=>`var(--ph-${p})`;
const phaseText=p=>`var(--ph-${p}-t)`;
function profileSVG(weeks,W){
  W=Math.max(Math.round(W||600),240);const H=186,pl=30,pb=22,pt=34;
  const max=Math.max(...weeks.map(w=>w.sessions.reduce((a,s)=>a+s.km,0)),10);
  const top=Math.ceil(max/10)*10;
  const bw=(W-pl-4)/weeks.length;
  const every=bw>=22?1:bw>=12?2:4;
  const y=v=>pt+(H-pt-pb)*(1-v/top);
  const today=new Date();today.setHours(0,0,0,0);
  const nowI=weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
  let g="";
  /* phase bands behind the bars, labelled when there is room (BB-25: replaces the phase legend) */
  for(let i=0;i<weeks.length;){
    let j=i;while(j+1<weeks.length&&weeks[j+1].phase===weeks[i].phase)j++;
    const ph=weeks[i].phase,x0=pl+i*bw,wd=(j-i+1)*bw,lbl=phaseLbl(ph);
    g+=`<rect class="band" data-phase="${esc(ph)}" x="${x0+1}" y="${pt-22}" width="${Math.max(0,wd-2)}" height="${H-pb-pt+22}" rx="4" fill="${phaseColor(ph)}" opacity=".13"/>`;
    if(wd>=lbl.length*6.6+10)g+=`<text class="band-lbl" x="${x0+6}" y="${pt-9}" style="fill:${phaseText(ph)};font-weight:600">${esc(lbl)}</text>`;
    i=j+1;
  }
  for(let t=0;t<=top;t+=top>60?20:10){g+=`<line x1="${pl}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(t)+4}" text-anchor="end">${t}</text>`;}
  weeks.forEach((w,i)=>{const km=w.sessions.reduce((a,s)=>a+s.km,0);const x=pl+i*bw+bw*0.14,bwi=bw*0.72;
    const lk=(w.sessions.find(s=>s.kind==="long"||s.kind==="race")||{}).km||0;
    const race=w.sessions.some(s=>s.kind==="race"),now=i===nowI;
    const lab=(i%every===0||i===weeks.length-1||race||now);
    const extra=[w.cutback?t("cutback"):"",now?t("svgNow"):"",race?t("svgRace"):""].filter(Boolean).join(", ");
    g+=`<g${race?' class="race"':""}${now?' class="now"':""}><title>${esc(t("svgTitle",{n:w.n,km:km.toFixed(1),phase:phaseLbl(w.phase)}))}${extra?" ("+esc(extra)+")":""}</title><rect x="${x}" y="${y(km)}" width="${bwi}" height="${Math.max(0,y(0)-y(km))}" rx="2" fill="${phaseColor(w.phase)}" opacity="${w.cutback?0.55:1}"/>
    ${lk?`<rect x="${x}" y="${y(lk)}" width="${bwi}" height="2" fill="var(--ink)" opacity=".55"/>`:""}
    ${lab?`<text x="${x+bwi/2}" y="${y(km)-5}" text-anchor="middle">${Math.round(km)}</text>`:""}
    ${race?`<path class="flag" d="M${x+bwi/2-4} ${y(km)-16}v-14l10 4l-10 4" fill="var(--race)" stroke="var(--race)" stroke-width="1.5" stroke-linejoin="round"/>`:""}
    ${lab?`<text x="${x+bwi/2}" y="${H-6}" text-anchor="middle"${now?' style="fill:var(--ink);font-weight:700"':""}>${w.n}</text>`:""}</g>`;});
  /* where today falls inside the current week */
  if(nowI>=0){const st=parseISO(weeks[nowI].start),d=Math.round((today-st)/864e5),xn=pl+nowI*bw+bw*(d+0.5)/7;
    g+=`<line class="today-mark" x1="${xn}" x2="${xn}" y1="${pt-22}" y2="${H-pb}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="3 3" opacity=".8"><title>${esc(cap(t("svgToday")))}</title></line>`;}
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${t("svgAria")}">${g}</svg>`;
}

/* recent quick workouts (bb-quick-recent): the last 5 sent, newest first */
const QW_KEYS=["type","size","race","unit","amt","wucd","ft"];
function qwLoadRecent(){try{const v=JSON.parse(localStorage.getItem("bb-quick-recent")||"[]");return Array.isArray(v)?v.filter(x=>x&&typeof x==="object"&&TYPE_DEFS.some(d=>d[0]===x.type)).slice(0,5):[];}catch(_){return [];}}
function qwPushRecent(Q){const c={};for(const k of QW_KEYS)c[k]=Q[k]??null;const key=JSON.stringify(c);
  const list=[c,...qwLoadRecent().filter(x=>JSON.stringify(Object.fromEntries(QW_KEYS.map(k=>[k,x[k]??null])))!==key)].slice(0,5);
  try{localStorage.setItem("bb-quick-recent",JSON.stringify(list));}catch(_){}}
function qwRecentLbl(c){const name=qwTypeName(c.type);
  if(QW_EASY[c.type])return `${name} · ${(+c.amt).toLocaleString(LOC())} ${c.unit==="t"?"min":"km"}`;
  return `${name} · ${t("qwSize_"+(c.size||"m"))} · ${cap(t("l"+(c.race||"10k")))}${c.ft?" · "+t("qwFtShort"):""}`;}
/* the repeated (or only) main set of a quality workout, the one fine-tune changes */
function qwMainIdx(wp){const i=wp.blocks.findIndex(b=>b.n>1);return i<0?0:i;}
/* "4:30" -> 270 s/km; 2:30 to 10:00 */
function parsePace(v){const m=/^\s*(\d{1,2})[:.,](\d{2})\s*$/.exec(String(v||""));if(!m||+m[2]>59)return null;const s=+m[1]*60+ +m[2];return s>=150&&s<=600?s:null;}
function qwLoadUnit(){try{return localStorage.getItem("bb-quick-unit")==="t"?"t":"d";}catch(_){return "d";}}
/* clean values when switching Distance <-> Time: 5 s under 1 min, 15 s under 2, 30 s under 10, then whole minutes; 50 m under 1 km, 0.1 km to 5 km, then 0.5 km */
function roundSec(x){const st=x<60?5:x<120?15:x<600?30:60;return Math.max(st,Math.round(x/st)*st);}
function roundKm(x){const st=x<1?0.05:x<5?0.1:0.5;return Math.max(0.05,+(Math.round(x/st)*st).toFixed(2));}
function wpInUnit(wp,unit,eff,P){
  const conv=(x,e)=>{if(x.p==="recovery")return x; /* jog recoveries stay in time, whatever the unit */
    const spk=stepSecKm(x,e,P);
    if(unit==="t"&&x.g[0]==='d')return {...x,g:['t',roundSec(durSec(x.g[1],spk))]};
    if(unit==="d"&&x.g[0]==='t')return {...x,g:['d',roundKm(kmIn(x.g[1],spk))]};
    return x;};
  const out={blocks:wp.blocks.map(b=>({n:b.n,steps:b.steps.map(x=>conv(x,stepEffort(x,eff)))}))};
  const wc=g=>unit==="t"?(g[0]==='t'?g:['t',600]):(g[0]==='d'?g:['d',2]);
  if(wp.wu)out.wu=wc(wp.wu);if(wp.cd)out.cd=wc(wp.cd);
  return out;
}
function qwTypeName(id){const ty=(S.types||[]).find(x=>x.id===id);return ty&&ty.name?ty.name:t("ty_"+id);}
function qwBuild(Q){
  const P=qwPaces(Q);const def=TYPE_DEFS.find(d=>d[0]===Q.type);const kind=def?def[1]:"easy",eff=effort(Q.type,kind);
  let wp;
  if(QW_EASY[Q.type]){
    const spk=Q.type==="recovery"?P.sec.easy*1.1:P.sec.easy;
    const km=Q.unit==="t"?kmIn(Q.amt*60,spk):Q.amt;
    if(Q.type==="strides")wp=watchPlan("easy",km,{strides:6});
    else if(Q.type==="progression"){const x=clamp(Math.round(km*0.3),1,5);wp=watchPlan("hard",km,{fast:x,fastPace:'tempo'});}
    else wp=watchPlan(kind,km);
    if(Q.unit==="t"){const b=wp.blocks[0];if(b.n===1&&b.steps.length===1)b.steps[0]={...b.steps[0],g:['t',Q.amt*60]};}
  }else{
    const rk=QW_RACES.find(r=>r[0]===Q.race)||QW_RACES[1];
    const w=workFor({id:Q.type},{p:QW_SIZES[Q.size],D:rk[1],c:rk[0],taper:false,P,phase:"build"});
    wp=watchPlan("hard",(w.wucd||0)+(w.km||0),w);
    if(!Q.wucd){delete wp.wu;delete wp.cd;}
  }
  wp=wpInUnit(wp,Q.unit,eff,P);
  /* fine-tune: reps, rep length and recovery on the main set (found before tuning, so 1 rep stays tunable), and a typed target pace */
  const mi=qwMainIdx(wp),repeated=wp.blocks[mi].n>1;
  let Pq=P;
  if(Q.ft&&!QW_EASY[Q.type]){const b=wp.blocks[mi],w=b.steps.find(x=>x.p!=="recovery"),r=b.steps.find(x=>x.p==="recovery");
    if(repeated&&Q.ft.n)b.n=Q.ft.n;if(w&&Q.ft.rep)w.g=[w.g[0],Q.ft.rep];if(r&&Q.ft.rec)r.g=[r.g[0],Q.ft.rec];
    if(w&&Q.ft.pace){w.pace="custom";Pq={...P,sec:{...P.sec,custom:Q.ft.pace},txt:{...P.txt,custom:fmtPace(Q.ft.pace)},fixed:{custom:true}};}}
  const bar=workoutBar(wp,eff,Pq);
  const km=bar.segs.reduce((a,g)=>a+g.km,0);
  return {wp,eff,P:Pq,name:qwTypeName(Q.type),bar,km,main:mainSetHtml(wp),mi,repeated};
}
function openQuick(type){
  const unit=qwLoadUnit();
  Object.assign(QW,{type:type||QW.type||"tempo",size:QW.size||"m",unit,wucd:QW.wucd!==false,dev:getDevice(),ft:null,ftOpen:false,add:false,addDate:qwDefaultDate(),
    race:QW.race||(S.inputs.goal!=="fitness"&&QW_RACES.some(r=>r[0]===S.inputs.dist)?S.inputs.dist:"10k")});
  qwSetAmt();
  modal(`<h2>${t("qwTitle")}</h2><div class="qw" id="qwBody"></div>`,m=>{
    m.addEventListener("click",e=>{const b=e.target.closest("[data-qk]");if(!b)return;const [k,v]=b.dataset.qk.split(":");
      if(["type","unit","size","race"].includes(k))QW.paceErr=false;
      if(k==="type"){QW.type=v;QW.ft=null;qwSetAmt();}
      else if(k==="unit"){if(QW.unit!==v){QW.unit=v;QW.ft=null;try{localStorage.setItem("bb-quick-unit",v);}catch(_){}qwSetAmt();}}
      else if(k==="size"){QW.size=v;QW.ft=null;}
      else if(k==="race"){QW.race=v;QW.ft=null;}
      else if(k==="recent"){const c=qwLoadRecent()[+v];if(c){for(const kk of QW_KEYS)QW[kk]=c[kk]??QW[kk];QW.ft=c.ft||null;QW.ftOpen=!!c.ft;}}
      else if(k==="ftreset"){QW.ft=null;QW.paceErr=false;}
      else if(k==="ft"){const [f,dir]=v.split(",");const R=qwBuild(QW),b=R.wp.blocks[R.mi],w=b.steps.find(x=>x.p!=="recovery"),r=b.steps.find(x=>x.p==="recovery");
        const ft=QW.ft||{n:b.n,rep:w.g[1],rec:r?r.g[1]:null},sg=dir==="+"?1:-1;
        if(f==="n")ft.n=clamp(ft.n+sg,1,30);
        else if(f==="rep")ft.rep=w.g[0]==='t'?Math.max(10,ft.rep+15*sg):Math.max(0.05,+(ft.rep+0.1*sg).toFixed(2));
        else if(f==="rec"&&r)ft.rec=r.g[0]==='t'?Math.max(10,ft.rec+15*sg):Math.max(0.05,+(ft.rec+0.05*sg).toFixed(2));
        QW.ft=ft;}
      else if(k==="dev")QW.dev=v;
      else if(k==="amt"){const st=QW.unit==="t"?5:0.5,lo=QW.unit==="t"?10:2,hi=QW.unit==="t"?240:42;QW.amt=clamp(+(QW.amt+(v==="+"?st:-st)).toFixed(1),lo,hi);}
      else if(k==="cancel"){closeModal();return;}
      else if(k==="send"){qwSend();return;}
      qwRender(m,b.dataset.qk);});
    m.addEventListener("change",e=>{const id=e.target.id;
      if(id==="qwWucd"){QW.wucd=e.target.checked;qwRender(m,"wucd");}
      else if(id==="qwPace"){const v=e.target.value.trim(),sec=parsePace(v);
        if(!v){if(QW.ft)delete QW.ft.pace;QW.paceErr=false;}
        else if(sec==null)QW.paceErr=true;
        else{const R=qwBuild(QW),b=R.wp.blocks[R.mi],w=b.steps.find(x=>x.p!=="recovery"),r=b.steps.find(x=>x.p==="recovery");
          QW.ft=QW.ft||{n:b.n,rep:w.g[1],rec:r?r.g[1]:null};QW.ft.pace=sec;QW.paceErr=false;}
        qwRender(m,"qwPace");}
      else if(id==="qwAdd"){QW.add=e.target.checked;qwRender(m,"qwAdd");}
      else if(id==="qwAddDate"){if(e.target.value)QW.addDate=e.target.value;}
      else if(id==="qwRecDist"||id==="qwRecTime"){qwSavePaces({recDist:m.querySelector("#qwRecDist").value,recTime:m.querySelector("#qwRecTime").value.trim()});qwRender(m,id);}});
    m.addEventListener("toggle",e=>{if(e.target.id==="qwFt")QW.ftOpen=e.target.open;},true);
    qwRender(m);
  });
}
/* add to plan (BB-58 step 4): off by default; the run then counts in the plan's +10% and spacing checks like any hand edit */
const qwPlanOpen=()=>!!(S.plan&&S.plan.weeks.length&&!missingSetup(S.inputs).length);
function qwPlanRange(){const st=parseISO(S.plan.weeks[0].start);return [st,addDays(st,7*S.plan.weeks.length-1)];}
function qwDefaultDate(){if(!qwPlanOpen())return "";const [a,b]=qwPlanRange(),d=new Date();d.setHours(12,0,0,0);return iso(d<a?a:d>b?b:d);}
function qwAddToPlan(R,dateIso){
  const [st]=qwPlanRange(),d=parseISO(dateIso),wi=Math.floor(Math.round((d-st)/864e5)/7),w=S.plan.weeks[wi];if(!w)return false;
  const def=TYPE_DEFS.find(x=>x[0]===QW.type)||["easy","easy"];
  const s={id:uid(),day:dow(d),typeId:QW.type,name:R.name,kind:def[1],km:Math.round(R.km*2)/2,desc:watchSummary(R.wp,R.P),note:"",watch:JSON.parse(JSON.stringify(R.wp))};
  w.sessions.push(s);w.sessions.sort((a,b)=>a.day-b.day);touched();return true;
}
function qwSetAmt(){const d=QW_EASY[QW.type];if(d)QW.amt=QW.unit==="t"?d.min:d.km;}

  }else{
    const sizes=Object.keys(QW_SIZES).map(k=>{const r=qwBuild({...Q,size:k});return radio("size",k,Q.size===k,`<b>${t("qwSize_"+k)}</b><span>${r.main.replace(/<\/?b>/g,"")}</span>`,"qsz");}).join("");
    shape=`<div class="qrow"><span class="lbl" id="qwSizeL">${t("qwSize")}</span><div class="qsizes" role="radiogroup" aria-labelledby="qwSizeL">${sizes}</div></div>
      <div class="qrow"><span class="lbl" id="qwRaceL">${t("qwRace")}</span><div class="seg" role="radiogroup" aria-labelledby="qwRaceL">${QW_RACES.map(([k])=>radio("race",k,Q.race===k,esc(cap(t("l"+k))))).join("")}</div></div>
      <label class="qcheck"><input type="checkbox" id="qwWucd" ${Q.wucd?"checked":""}> ${t("qwWucd")}</label>`;
    const b=R.wp.blocks[R.mi],w=b.steps.find(x=>x.p!=="recovery"),r=b.steps.find(x=>x.p==="recovery");
    const stepper=(f,lbl,val)=>`<div class="qft"><span id="qwFt_${f}">${lbl}</span><div class="qstep" role="group" aria-labelledby="qwFt_${f}"><button type="button" class="btn" data-qk="ft:${f},-" aria-label="${esc(t("qwLess")+" · "+lbl)}">−</button><output aria-live="polite">${val}</output><button type="button" class="btn" data-qk="ft:${f},+" aria-label="${esc(t("qwMore")+" · "+lbl)}">+</button></div></div>`;
    const isT=w.g[0]==='t';
    const paceVal=Q.ft&&Q.ft.pace?fmtPace(Q.ft.pace).replace("/km",""):(w.pace&&hasPace(R.P,w.pace)?fmtPace(R.P.sec[w.pace]).replace("/km",""):"");
    const icon=`<svg class="qfi" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></g></svg>`;
    const chev=`<svg class="chev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    shape+=`<details class="qfine" id="qwFt" ${Q.ftOpen?"open":""}><summary>${icon}<span class="qfs"><b>${t("qwFt")}</b><small>${t("qwFtSub")}</small></span>${Q.ft?`<span class="qtag">${t("qwFtTag")}</span>`:""}${chev}</summary><div class="qfts">
      ${R.repeated?stepper("n",t("qwReps"),b.n):""}
      ${stepper("rep",t(isT?"qwRepT":"qwRepD"),gTxt(w.g))}
      ${r?stepper("rec",t(r.g[0]==='t'?"qwRecT":"qwRecD"),gTxt(r.g)):""}
      <div class="qft"><label for="qwPace">${t("qwPace")}</label><span class="qpace"><input id="qwPace" inputmode="decimal" autocomplete="off" placeholder="4:30" value="${esc(paceVal)}" aria-describedby="qwPaceHint"> /km</span></div>
      <p class="hint" id="qwPaceHint">${Q.paceErr?t("qwPaceBad"):t("qwPaceHint")}</p>
      ${Q.ft?`<button type="button" class="linkbtn" data-qk="ftreset:1">${t("qwFtReset")}</button>`:""}</div></details>`;
  }
  let pacesLine;
  if(planHasPaces())pacesLine=`<p class="hint qpaces">${t("qwPacesPlan",{plan:esc(S.name)})}</p>`;
  else{const qp=qwLoadPaces(),bad=+qp.recDist>0&&qp.recTime&&raceTimeSec(qp.recTime,+qp.recDist)==null;
    const opts=[["0","none"],["5","l5k"],["10","l10k"],["21.0975","halfMarathon"],["42.195","marathon"]];
    pacesLine=`<div class="qrow"><span class="lbl">${t("qwPaces")}</span><div class="qpacef">
      <label>${t("recDist")}<select id="qwRecDist">${opts.map(([v,k])=>`<option value="${v}" ${qp.recDist===v?"selected":""}>${esc(t(k))}</option>`).join("")}</select></label>
      <label>${t("recTime")}<input id="qwRecTime" inputmode="numeric" placeholder="${esc(t("recTimePh"))}" value="${esc(qp.recTime)}"></label></div>
      <p class="hint qpaces">${bad?t("qwPacesBad"):R.P.vdot?t("qwPacesOwn"):t("qwPacesEffort")}</p></div>`;}
  const dev=DEVICES.find(d=>d.k===Q.dev)||DEVICES[0];
  const recent=qwLoadRecent();
  body.innerHTML=`
    ${recent.length?`<div class="qrow"><span class="lbl" id="qwRecL">${t("qwRecent")}</span><div class="qgrp" role="group" aria-labelledby="qwRecL">${recent.map((c,i)=>`<button type="button" class="qt qrec" data-qk="recent:${i}">${esc(qwRecentLbl(c))}</button>`).join("")}</div></div>`:""}
    <div class="qrow"><span class="lbl" id="qwTypeL">${t("qwType")}</span><div class="qtypes" role="radiogroup" aria-labelledby="qwTypeL">
      <div class="qgrp"><span class="qglbl">${t("grpEasy")}</span>${easyIds.map(typeBtn).join("")}</div>
      <div class="qgrp"><span class="qglbl">${t("grpQuality")}</span>${qIds.map(typeBtn).join("")}</div></div>
      ${whyOf(Q.type)?`<p class="hint why" id="qwWhy">${whyHtml(Q.type)}</p>`:""}</div>
    <div class="qrow"><span class="lbl" id="qwUnitL">${t("qwUnit")}</span><div class="seg" role="radiogroup" aria-labelledby="qwUnitL">${radio("unit","d",Q.unit==="d",t("qwUnitD"))}${radio("unit","t",Q.unit==="t",t("qwUnitT"))}</div></div>
    ${shape}
    ${pacesLine}
    ${qwPlanOpen()?(()=>{const [a,b]=qwPlanRange();return `<div class="qrow"><label class="qcheck"><input type="checkbox" id="qwAdd" ${Q.add?"checked":""}> ${t("qwAdd",{plan:esc(S.name)})}</label>
      ${Q.add?`<label class="qadd">${t("qwAddOn")} <input type="date" id="qwAddDate" min="${iso(a)}" max="${iso(b)}" value="${esc(Q.addDate)}"></label><p class="hint qpaces">${t("qwAddHint")}</p>`:""}</div>`;})():""}
    <div class="qprev" style="--k:${effColor(R.eff)};--kt:${effText(R.eff)}">
      <div class="tses"><div class="tn"><b>${esc(R.name)}</b></div>
      <div class="tbig"><b id="qwKm">${(Math.round(R.km*10)/10).toLocaleString(LOC())}<small> km</small></b><span>${t("tdEst",{d:estDur(R.bar.sec)})}</span></div>${R.bar.html}
      <p id="qwSteps">${esc(watchSummary(R.wp,R.P))}</p></div>
      <div class="seg qdev" role="radiogroup" aria-label="${esc(t("device"))}">${DEVICES.map(d=>radio("dev",d.k,Q.dev===d.k,esc(d.name()))).join("")}</div>
      <div class="actions"><button type="button" class="btn" data-qk="cancel">${t("cancel")}</button><button type="button" class="btn primary" id="qwSend" data-qk="send">${esc(dev.k==="other"?t("sendWatch"):t("sendTo",{dev:dev.name()}))}</button></div>
    </div>`;
  if(focusKey){const f=body.querySelector(`[data-qk="${focusKey}"]`)||body.querySelector("#"+focusKey)||(focusKey==="wucd"?body.querySelector("#qwWucd"):null);f&&f.focus();}
}
function qwSend(){
  const R=qwBuild(QW);const day=iso(new Date());
  const tag=QW_EASY[QW.type]?`${String(QW.amt).replace(".","-")}${QW.unit==="t"?"min":"km"}`:t("qwSize_"+QW.size).toLowerCase();
  const file=`quick-${day}-${slug(R.name)}-${slug(tag)}`;
  const title=`${R.name} · ${R.main.replace(/<\/?b>/g,"")}`;
  qwPushRecent(QW);
  if(QW.add&&qwPlanOpen())qwAddToPlan(R,QW.addDate);
  setDevice(QW.dev);document.querySelectorAll('#plan .today [data-act="twatch"]').forEach(b=>b.textContent=sendLbl(b.dataset.n||""));
  closeModal();
  exportWorkouts(QW.dev,[{title,fitTitle:title,file,wp:R.wp,paces:R.P}],file);
}

function finishersUrl(I){const m=Math.round(distKm(I)*1000);return `https://www.finishers.com/courses?discipline=road&dmin=${m}&dmax=${m}&distanceUnit=meters`;}
function nameFromUrl(u){try{const x=new URL(u);if(!/finishers\.com$/.test(x.hostname.replace(/^www\./,"")))return "";const seg=x.pathname.split("/").filter(Boolean);const i=seg.indexOf("course");const slug=i>=0?seg[i+1]:seg[seg.length-1];if(!slug)return "";return decodeURIComponent(slug).replace(/-/g," ").replace(/\b\w/g,c=>c.toUpperCase()).replace(/\b(De|Du|Des|La|Le|Les|Et|D|L)\b/g,w=>w.toLowerCase());}catch(_){return "";}}

/* greeting */
function renderHello(){
  const el=$("#hello");if(!el)return;
  const P=S.plan,I=S.inputs;
  const today=new Date();today.setHours(12,0,0,0);
  const race=parseISO(I.raceDate);const days=Math.round((race-today)/864e5);
  const lbl=distLabel(I);
  let line;
  const R0=I.race&&I.race.name?I.race:null;
  if(I.goal==="fitness"){
    const st0=parseISO(P.weeks[0].start),end=addDays(st0,7*P.weeks.length-1);
    const wi=P.weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
    if(today<st0)line=t("hFitStarts",{n:P.weeks.length,d:fmtDate(st0)});
    else if(wi<0)line=t("hFitDone",{n:P.weeks.length,d:fmtDate(end)});
    else{const w=P.weeks[wi];const tdow=dow(today);
      const next=w.sessions.find(s=>s.day>=tdow)||(P.weeks[wi+1]&&P.weeks[wi+1].sessions[0]);
      const when=next?(next.day===tdow&&w.sessions.includes(next)?t("today"):DAYS[next.day]):"";
      line=t("hFitIn",{n:w.n,t:P.weeks.length,phase:phaseLbl(w.phase),cut:w.cutback?t("hCut"):""})+(next?t("hNext",{when,name:esc(next.name.toLowerCase()),km:next.km}):"");}
  }
  else if(days<0){
    /* BB-42: in a recovery week after the race, say so and name the next run */
    const wi=P.weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
    const w=wi>=0?P.weeks[wi]:null;
    if(w&&w.phase==="recovery"){const tdow=dow(today),rw=P.weeks.filter(x=>x.phase==="recovery");
      const next=w.sessions.find(s=>s.day>=tdow)||(P.weeks[wi+1]&&P.weeks[wi+1].sessions[0]);
      const when=next?(next.day===tdow&&w.sessions.includes(next)?t("today"):DAYS[next.day]):"";
      line=t("hRecIn",{lbl:esc(lbl),k:rw.indexOf(w)+1,r:rw.length})+(next?t("hNext",{when,name:esc(next.name.toLowerCase()),km:next.km}):"");}
    else line=t("hPast",{lbl:esc(lbl),d:fmtDate(race)});
  }
  else if(days===0)line=t("hToday",{lbl:esc(lbl)});
  else{
    const wi=P.weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
    const head=t(days===1?"hDay1":"hDays",{n:days,lbl:esc(lbl),d:fmtDate(race)});
    if(wi<0){line=head+" "+t("hStarts",{d:fmtDate(parseISO(P.weeks[0].start))});}
    else{
      const w=P.weeks[wi];const tdow=dow(today);
      const next=w.sessions.find(s=>s.day>=tdow)||(P.weeks[wi+1]&&P.weeks[wi+1].sessions[0]);
      const when=next?(next.day===tdow&&w.sessions.includes(next)?t("today"):DAYS[next.day]):"";
      line=head+" "+t("hInWeek",{n:w.n,t:P.weeks.filter(x=>x.phase!=="recovery").length,phase:phaseLbl(w.phase),cut:w.cutback?t("hCut"):""})+(next?t("hNext",{when,name:esc(next.name.toLowerCase()),km:next.km}):"");
    }
  }
  const R=I.race;let cd="";
  if(I.goal!=="fitness"&&R&&R.name&&days>=0){
    const nm=R.url?`<a class="rn" href="${esc(R.url)}" target="_blank" rel="noopener">${esc(R.name)}</a>`:`<span class="rn">${esc(R.name)}</span>`;
    cd=`<div class="countdown"><div class="num">${days}<small>${days===1?t("dayOne"):t("dayMany")}</small></div>${nm}<span class="rm">${R.city?esc(R.city)+" · ":""}${fmtDay(race)} · ${esc(lbl)}</span></div>`;
  }
  el.innerHTML=`<div class="txt"><p class="lead">${line}</p></div>${cd}`;
}

let modalOpener=null,lastTrigger=null;
/* Safari doesn't focus a button on click, so remember the last control pressed */
document.addEventListener("pointerdown",e=>{const c=e.target.closest&&e.target.closest("button,a[href],[tabindex]");if(c&&!c.closest("#modalRoot"))lastTrigger=c;},true);
function openerKey(el){if(el.id)return "#"+CSS.escape(el.id);const at=["data-act","data-w","data-s","data-d"].filter(a=>el.hasAttribute(a));return at.length?at.map(a=>`[${a}="${CSS.escape(el.getAttribute(a))}"]`).join(""):null;}
function modal(html,onMount){const root=$("#modalRoot");if(!root.firstChild){const a=document.activeElement;const o=a&&a!==document.body&&!a.closest("#modalRoot")?a:lastTrigger;modalOpener=o?{el:o,key:openerKey(o)}:null;}
  root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const bg=root.firstChild;bg.addEventListener("click",e=>{if(e.target===bg)closeModal();});const m=bg.firstChild;
  const h=m.querySelector("h2");if(h){h.id="modalTitle";m.setAttribute("aria-labelledby","modalTitle");}
  onMount&&onMount(m);m.tabIndex=-1;m.focus({preventScroll:true});return m;}
function closeModal(){$("#modalRoot").innerHTML="";const o=modalOpener;modalOpener=null;if(!o)return;
  /* wait until the caller has redrawn the page, and skip if another dialog opened meanwhile */
  queueMicrotask(()=>{if($("#modalRoot").firstChild)return;const el=o.el.isConnected?o.el:(o.key&&document.querySelector(o.key));if(el&&typeof el.focus==="function")el.focus({preventScroll:true});});}
function modalFocusables(m){return [...m.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.getClientRects().length);}
document.addEventListener("keydown",e=>{const m=$("#modalRoot .modal");if(!m)return;
  if(e.key==="Escape"){closeModal();return;}
  if(e.key!=="Tab")return;const f=modalFocusables(m);if(!f.length){e.preventDefault();m.focus();return;}

  e.preventDefault();const i=f.indexOf(document.activeElement);

/* ---------- Apple Watch (.workout via WorkoutKit format) ---------- */
const PACE_TOL={easy:25,tempo:8,interval:8,rep:6,race:6,mp:8,custom:8};
/* a step has a number pace when paces come from a race time, or when the runner typed that pace (quick workout fine-tune) */
const hasPace=(P,k)=>!!(k&&(P.vdot||(P.fixed&&P.fixed[k])));
const paceLbl=k=>t("pl_"+k);
function gTxt(g){if(g[0]==='d'){const m=Math.round(g[1]*1000);return m<1000||m%1000?(m>=1000?(m/1000).toLocaleString(LOC(),{maximumFractionDigits:1})+" km":m+" m"):m/1000+" km";}const z=g[1];return z>=60?(z%60?Math.floor(z/60)+":"+String(z%60).padStart(2,"0")+" min":z/60+" min"):z+" s";}
function stepTxt(x,P){return gTxt(x.g)+(x.pace?" @ "+(hasPace(P,x.pace)?P.txt[x.pace]:paceLbl(x.pace)):"")+(x.p==="recovery"?t("recoverySfx"):"");}
function watchSummary(wp,P){P=P||paces(S.inputs);const parts=[];if(wp.wu)parts.push(t("warmup")+" "+gTxt(wp.wu));
  for(const b of wp.blocks){const st=b.steps.map(x=>stepTxt(x,P)).join(", ");parts.push(b.n>1?`${b.n} × (${st})`:st);}
  if(wp.cd)parts.push(t("cooldown")+" "+gTxt(wp.cd));return parts.join(" · ");}
function rescaleWatch(wp,delta){wp=JSON.parse(JSON.stringify(wp));
  if(wp.wu&&wp.cd){wp.cd=['d',r05(Math.max(0.5,wp.cd[1]+delta))];return wp;}
  const st=wp.blocks[0]&&wp.blocks[0].n===1&&wp.blocks[0].steps.find(x=>x.g[0]==='d');
  if(st)st.g=['d',r05(Math.max(0.5,st.g[1]+delta))];return wp;}
let WK=null;
function loadWK(){if(!WK)WK=Promise.all([import("./vendor/workoutkit-0.2.0/index.js"),import("./vendor/workoutkit-0.2.0/encode.js")]).catch(e=>{WK=null;throw e;});return WK;}
/* a workout to export: {title, fitTitle, file, wp, paces?}. Plan runs and BB-58 quick workouts share it, so export needs no plan week. */
function planWorkout(w,s){return {title:`W${w.n} ${s.name} ${s.km} km`,fitTitle:`W${w.n} ${s.name} ${s.km}k`,file:`w${String(w.n).padStart(2,"0")}-${DAYS[s.day].toLowerCase()}-${slug(s.name)}`,wp:s.watch||watchPlan(s.kind,s.km)};}
const planWorkouts=list=>list.map(({w,s})=>planWorkout(w,s));
async function workoutBlob(it){
  const [K,E]=await loadWK();const P=it.paces||paces(S.inputs);const wp=it.wp;
  const plan=new K.WorkoutPlan({referenceId:crypto.randomUUID()});
  const cw=plan.asCustom({activity:"running",location:"outdoor",displayName:it.title.slice(0,48)});
  const goal=g=>g[0]==='d'?new K.DistanceGoal(new K.Distance(Math.round(g[1]*1000),"meters")):new K.TimeGoal(new K.Duration(Math.round(g[1]),"seconds"));
  const alert=pace=>{if(!hasPace(P,pace))return undefined;const sec=P.sec[pace],tol=PACE_TOL[pace];const sp=x=>new K.Speed(new K.Distance(1,"kilometers"),new K.Duration(Math.round(x),"seconds"));return new K.SpeedRangeAlert(sp(sec+tol),sp(sec-tol),"current");};
  if(wp.wu)cw.warmup=new K.Step(goal(wp.wu),t("warmup"));
  for(const b of wp.blocks){const blk=cw.addBlock(Math.max(1,b.n));for(const x of b.steps)blk.addStep(x.p,goal(x.g),x.pace?(hasPace(P,x.pace)?P.txt[x.pace]:paceLbl(x.pace)):undefined,alert(x.pace));}
  if(wp.cd)cw.cooldown=new K.Step(goal(wp.cd),t("cooldown"));
  return E.toBlob(plan);
}
/* minimal ZIP writer (stored, no compression): .workout and .ics aren't on the download allowlist, .zip is */
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
const crc32=b=>{let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRC_T[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;};
function makeZip(files){
  const enc=new TextEncoder(),parts=[],central=[];let off=0;
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1))&0xFFFF,dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate())&0xFFFF;

    const h=new DataView(new ArrayBuffer(30));

    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,dt,true);c.setUint16(14,dd,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer),name);

/* ---------- Garmin FIT workout encoder ---------- */
const FIT_CRC=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];

function fitEncodeWorkout(name,steps){
  // steps: [{name,dur:'time'|'distance'|'open'|'repeat',val,target:{lo,hi}|null,intensity,repeatFrom,reps}]
  const out=[];const push=(...a)=>{for(const x of a)out.push(x&0xFF);};
  const u16=v=>[v&0xFF,(v>>8)&0xFF], u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  const str=(s,n)=>{const b=Array.from(new TextEncoder().encode(String(s||""))).slice(0,n-1);while(b.length<n)b.push(0);return b;};
  // file_id (local 0)
  push(0x40,0,0,...u16(0),5, 0,1,0x00, 1,2,0x84, 2,2,0x84, 3,4,0x8C, 4,4,0x86);
  const created=Math.floor(Date.now()/1000)-631065600;
  push(0x00,5,...u16(255),...u16(0),...u32(Math.floor(Math.random()*0xFFFFFFF)+1),...u32(created));
  // workout (local 1)
  push(0x41,0,0,...u16(26),3, 8,24,0x07, 4,1,0x00, 6,2,0x84);
  push(0x01,...str(name,24),1,...u16(steps.length));
  // workout_step (local 2)
  push(0x42,0,0,...u16(27),9, 254,2,0x84, 0,16,0x07, 1,1,0x00, 2,4,0x86, 3,1,0x00, 4,4,0x86, 5,4,0x86, 6,4,0x86, 7,1,0x00);
  const DUR={time:0,distance:1,open:5,repeat:6};
  steps.forEach((s,i)=>{
    let dv=0xFFFFFFFF,tt=2,tv=0,lo=0,hi=0;
    if(s.dur==="time")dv=Math.round(s.val*1000);
    else if(s.dur==="distance")dv=Math.round(s.val*100);
    else if(s.dur==="repeat"){dv=s.repeatFrom;tt=2;tv=s.reps;}
    if(s.dur==="repeat"){tt=0xFF;lo=0xFFFFFFFF;hi=0xFFFFFFFF;}else if(s.target){tt=0;tv=0;lo=Math.round(s.target.lo*1000);hi=Math.round(s.target.hi*1000);}else{lo=0xFFFFFFFF;hi=0xFFFFFFFF;}

  });

  const hc=fitCrc(hdr);const header=Uint8Array.from([...hdr,...u16(hc)]);

  const file=new Uint8Array(header.length+data.length+2);file.set(header,0);file.set(data,header.length);file.set(u16(crc),header.length+data.length);
  return file;
}

function fitSteps(wp,P){
  P=P||paces(S.inputs);const out=[];
  const goal=g=>g[0]==='d'?{dur:"distance",val:g[1]*1000}:{dur:"time",val:g[1]};
  const tgt=pace=>{if(!hasPace(P,pace))return null;const sec=P.sec[pace],tol=PACE_TOL[pace];return {lo:1000/(sec+tol),hi:1000/(sec-tol)};};
  const lbl=x=>x.pace?(hasPace(P,x.pace)?P.txt[x.pace]:paceLbl(x.pace)):(x.p==="recovery"?t("recover"):t("run"));
  if(wp.wu)out.push({name:t("warmup"),...goal(wp.wu),target:null,intensity:2});
  for(const b of wp.blocks){const from=out.length;
    for(const x of b.steps)out.push({name:lbl(x),...goal(x.g),target:tgt(x.pace),intensity:x.p==="recovery"?4:0});
    if(b.n>1)out.push({name:"",dur:"repeat",repeatFrom:from,reps:b.n});}
  if(wp.cd)out.push({name:t("cooldown"),...goal(wp.cd),target:null,intensity:3});
  return out;
}

async function exportWorkouts(dev,items,zipBase){
  const D=DEVICES.find(d=>d.k===dev);
  if(dev==="apple"){try{await loadWK();}catch(_){toast(t("wkLoadFail"));return;}}
  const files=[],seen=new Map();
  for(const it of items){
    /* two workouts with the same file name (same day, same type) get -2, -3 instead of overwriting each other on unzip (BB-15) */
    const n=(seen.get(it.file)||0)+1;seen.set(it.file,n);
    const base=n>1?`${it.file}-${n}`:it.file;
    try{
      const data=dev==="apple"?new Uint8Array(await (await workoutBlob(it)).arrayBuffer()):fitEncodeWorkout(it.fitTitle||it.title,fitSteps(it.wp,it.paces));
      files.push({name:`${base}.${D.ext}`,data});
    }catch(e){console.error(e);toast(t("buildFail",{name:it.title,m:(e&&e.message)||t("unknownErr")}));return;}
  }
  if(!files.length)return;
  const name=(zipBase||files[0].name.replace(/\.\w+$/,""))+"-"+D.k;
  try{dlSave({filename:name+".zip",data:makeZip(files)});toast(t(files.length>1?"savedMany":"savedOne",{n:files.length,dev:D.name(),help:D.help()}));}
  catch(e){toast(downloadErr(e));}
}

      doc.text(pdfTxt(`Block Builder · ${gen}`),M,ph-5);doc.text(pdfTxt(t("pdfPage",{p,n})),pw-M,ph-5,{align:"right"});}
    saveFile(fname("pdf"),doc.output("blob"));

}

    customKm:nNum(I.customKm,3,100,d.customKm),raceDate:nIso(I.raceDate,d.raceDate),weeks:Math.round(nNum(I.weeks,3,30,d.weeks)),
    curVol:opt(I.curVol,0,200),curLong:opt(I.curLong,0,45),recDist:["0","5","10","21.0975","42.195"].includes(String(I.recDist))?String(I.recDist):"0",
    recTime:nStr(I.recTime,12),level:levelOf(I),recWeeks:recWeeksOf({goal:"race",recWeeks:I.recWeeks}),runs:Math.round(nNum(I.runs,0,7,0)),

    const sessions=[];
    for(const s of Array.isArray(w.sessions)?w.sessions.slice(0,14):[]){
      const day=+(s&&s.day);if(!Number.isInteger(day)||day<0||day>6)continue;
      let id=nId(s.id);if(!id||seenS.has(id))id=uid();seenS.add(id);
      const typeId=s.typeId==="race"?"race":nId(s.typeId)||"easy";const watch=nWatch(s.watch);
      sessions.push({id,day,typeId,name:nStr(s.name,80)||t("ty_easy"),kind:KINDS.includes(s.kind)?s.kind:"easy",km:Math.round(nNum(s.km,0,500,0)*100)/100,desc:nStr(s.desc,4000),note:nStr(s.note,4000),...(watch?{watch}:{})});
    }
    sessions.sort((a,b)=>a.day-b.day);
    weeks.push({n:weeks.length+1,phase:WEEK_PHASES.includes(w.phase)?w.phase:"base",cutback:!!w.cutback,start,target:Math.round(nNum(w.target,0,2000,0)),note:nStr(w.note,4000),sessions});
  }
  if(!weeks.length)return null;
  const M=p.plan.meta&&typeof p.plan.meta==="object"?p.plan.meta:{};const vdot=nNum(M.vdot,15,90,null),raceSec=nNum(M.raceSec,60,86400,null);
  const meta={noRace:inputs.goal==="fitness",D:distKm(inputs),c:["5k","10k","hm","m"].includes(M.c)?M.c:cat(distKm(inputs)),taperN:Math.round(nNum(M.taperN,0,3,0)),
    peakV:Math.round(nNum(M.peakV,0,2000,0)),start:nIso(M.start,weeks[0].start),vdot,raceSec,racePace:vdot&&raceSec?nStr(M.racePace,16):null};
  return {name:nStr(p.name,120).trim()||t("trainingBlock"),inputs,types,plan:{weeks,meta},edited:!!p.edited,updatedAt:nNum(p.updatedAt,0,8.64e15,0)};
}
function snapshot(){return {name:S.name,inputs:S.inputs,types:S.types,plan:S.plan,edited:S.edited,updatedAt:Date.now()};}
function setStatus(t){$("#saveStatus").textContent=t;}
let saveTimer=null;
function markDirty(){S.dirty=true;if(S.savedAt){setStatus(t("unsaved"));clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;savePlan(true);},1500);}}
async function savePlan(auto){
  if(missingSetup(S.inputs).length){if(!auto)toast(t("needTitle"));return;}
  cancelSave();
  const data=snapshot();
  try{
    setStatus(t("saving"));
    {const all=lsAll();all[S.planId]=data;localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();}
    S.savedAt=Date.now();S.dirty=false;S.isExample=false;
    S.savedLbl=null;setStatus(t("savedLocal")+" · "+new Date().toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"}));
    if(!auto){toast(t("planSaved"));renderPlan();}
  }catch(e){setStatus(t("notSaved"));toast(t("saveFail"));}
}
function lsAll(){try{return JSON.parse(localStorage.getItem("bb-plans")||"{}")||{};}catch(_){return {};}}
function refreshLocalList(){const all=lsAll();S.saved=Object.entries(all).filter(([id])=>nId(id)).map(([id,d])=>{const n=normalizeSaved(d);return n&&{id,...n};}).filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt);}
/* autosave waits 1.5 s after the last change: write it now before anything replaces the current plan */
function flushSave(){if(!saveTimer)return;clearTimeout(saveTimer);saveTimer=null;if(S.savedAt&&S.dirty)savePlan(true);}
function cancelSave(){clearTimeout(saveTimer);saveTimer=null;}
addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave();});
addEventListener("beforeunload",e=>{flushSave();if(S.dirty&&!S.savedAt&&!S.isExample&&!missingSetup(S.inputs).length){e.preventDefault();e.returnValue="";}});
function loadPlan(p){
  S.intake=0;
  S.planId=p.id;S.name=p.name;S.nameAuto=false;S.inputs={...DEFAULT_INPUTS(),...JSON.parse(JSON.stringify(p.inputs))};S.types=JSON.parse(JSON.stringify(p.types));S.plan=JSON.parse(JSON.stringify(p.plan));S.edited=!!p.edited;S.savedAt=p.updatedAt;S.isExample=false;S.pendingRegen=false;S.dirty=false;
  $("#planName").value=S.name;renderSetup();renderPlan();setStatus(t("savedLocal")+" · "+new Date(p.updatedAt).toLocaleDateString(LOC(),{day:"numeric",month:"short"}));
}
function openPlans(){
  const list=S.saved;
  modal(`<h2>${t("myPlans")}</h2><p class="hint" style="margin:0">${t("localOnly")}</p>
  <div class="plans-list">${list.length?list.map(p=>`<div class="pl ${p.id===S.planId?"cur":""}"><div class="info"><b>${esc(p.name)}</b><span>${esc(cap(t(p.inputs&&p.inputs.goal==="fitness"?"planMetaFit":"planMeta",{lbl:p.inputs?distLabel(p.inputs):"",w:p.plan?p.plan.weeks.length:"?",d:p.inputs?fmtDate(parseISO(p.inputs.goal==="fitness"?(p.plan&&p.plan.meta.start||p.inputs.startDate):p.inputs.raceDate)):""})))}</span></div><button class="btn sm" data-open="${p.id}">${t("open")}</button><button class="btn sm ghost" data-delp="${p.id}">${t("del")}</button></div>`).join(""):`<p class="hint" style="margin:0">${t("noPlans")}</p>`}</div>
  <div class="actions"><button class="btn left" id="pImport">${t("importPlans")}</button><button class="btn" id="pExport" ${list.length?"":"disabled"}>${t("exportPlans")}</button><button class="btn" id="pClose">${t("close")}</button></div>`,m=>{
    m.querySelector("#pClose").onclick=closeModal;
    m.querySelector("#pExport").onclick=()=>{saveFile("block-builder-plans-"+iso(new Date())+".json",new Blob([JSON.stringify({app:"block-builder",version:1,plans:lsAll()},null,1)],{type:"application/json"}));};
    m.querySelector("#pImport").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
      inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
        try{const j=JSON.parse(await f.text());const src=j&&j.app==="block-builder"&&j.plans&&typeof j.plans==="object"?j.plans:null;if(!src)throw 0;
          flushSave();
          /* BB-4: a plan already here (same id) is replaced only by a newer copy. The same version is skipped;
             when the copy here changed more recently, the file's version is added beside it as "(imported)". Nothing is lost. */
          const all=lsAll();let n=0,copies=0,same=0,valid=0,reopen=false;
          for(const [id0,p] of Object.entries(src)){const c=normalizeSaved(p);if(!c)continue;valid++;const id=nId(id0)||uid();
            const here=all[id]?normalizeSaved(all[id]):null;
            if(!here||c.updatedAt>here.updatedAt){all[id]=c;n++;if(here&&id===S.planId)reopen=true;}
            else if(c.updatedAt===here.updatedAt&&JSON.stringify(c)===JSON.stringify(here))same++;
            else{all[uid()]={...c,name:nStr(t("copyName",{name:c.name}),120)};n++;copies++;}}
          if(!valid)throw 0;
          localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();closeModal();
          if(reopen){const cur=S.saved.find(x=>x.id===S.planId);if(cur)loadPlan(cur);}
          toast(n?t("imported",{n})+(copies?" "+t("impCopy",{n:copies}):"")+(same?" "+t("impSame",{n:same}):""):t("impNone",{n:same}));openPlans();}
        catch(_){toast(t("importFail"));}};
      inp.click();};
    m.addEventListener("click",e=>{const o=e.target.closest("[data-open]"),d=e.target.closest("[data-delp]");
      if(o){flushSave();const p=S.saved.find(x=>x.id===o.dataset.open);closeModal();if(p)loadPlan(p);}
      if(d){const p=S.saved.find(x=>x.id===d.dataset.delp);closeModal();confirmBox(t("delQ"),t("delT",{name:p.name}),t("del"),async()=>{
        try{if(p.id===S.planId)cancelSave();{const all=lsAll();delete all[p.id];localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();}
          if(p.id===S.planId){S.savedAt=null;S.planId=uid();setStatus(t("notSaved"));}toast(t("deleted"));}catch(_){toast(t("delFail"));}});}
    });
  });
}
/* ---------- setup steps on phones (BB-34) ----------
   A new plan on a phone walks Goal, Race (or Focus), Running now and Week one at a time, each checked before Next.
   The sections are the same ones the full form shows; "Show all settings" leaves the steps. */
const phoneLayout=()=>{try{return matchMedia("(max-width:900px)").matches;}catch(_){return false;}};
const STEP_NAMES=()=>["secGoal",S.inputs.goal==="fitness"?"secFocus":"secRace","secNow","secYourWeek"];
function renderIntro(){
  const A=$("#setup"),nav=$("#introNav"),n=S.intake||0;if(!A||!nav)return;
  if(n)A.dataset.step=n;else delete A.dataset.step;
  nav.hidden=!n;if(!n){nav.innerHTML="";return;}
  const ready=!missingSetup(S.inputs).length&&S.plan;
  const prev=n>=3?(ready?`<div class="intro-prev"><span class="lbl">${t("loadProfile")}</span><div class="chart">${profileSVG(S.plan.weeks,Math.max(260,(A.clientWidth||340)-8))}</div></div>`:`<p class="hint intro-wait">${t("introWait")}</p>`):"";
  nav.innerHTML=`${prev}<p class="intro-err" id="introErr" role="alert">${esc(S.introErr||"")}</p>
    <div class="intro-bar"><button type="button" class="btn" data-intro="back" ${n===1?"hidden":""}>${t("introBack")}</button>
    <span class="intro-step">${t("introStep",{n,name:t(STEP_NAMES()[n-1])})}</span>
    <button type="button" class="btn primary" data-intro="next">${t(n===4?"introDone":"introNext")}</button></div>
    <button type="button" class="linkbtn intro-skip" data-intro="skip">${t("introSkip")}</button>`;
}
function introGo(n){S.intake=n;S.introErr="";renderSetup();const A=$("#setup");if(A&&A.scrollIntoView)A.scrollIntoView({block:"start"});}
$("#setup").addEventListener("click",e=>{
  const c=e.target.closest(".icard"),b=e.target.closest("[data-intro]");
  if(c&&c.dataset.goal&&S.intake===1){introGo(2);return;}
  if(!b)return;const a=b.dataset.intro,n=S.intake||0;
  if(a==="quick"){openQuick();return;}
  if(a==="back"&&n>1)introGo(n-1);
  else if(a==="skip"){S.intake=0;S.introErr="";renderSetup();}
  else if(a==="next"){
    const need=missingSetup(S.inputs).filter(k=>SETUP_STEP[k]===n);
    if(need.length){S.introErr=t("introNeed")+" "+need.map(k=>t(k)).join(" ");renderIntro();return;}
    if(n<4)introGo(n+1);else{S.intake=0;S.introErr="";renderSetup();renderPlan();setTab("plan");}
  }
});
function newPlan(){
  flushSave();
  const go=()=>{S.nameAuto=true;S.inputs=BLANK_INPUTS();S.types=BLANK_TYPES();S.planId=uid();S.savedAt=null;S.isExample=false;S.dirty=false;S.pendingRegen=false;S.name=cap(t("blockName",{lbl:t("lhm")}));$("#planName").value=S.name;S.intake=phoneLayout()?1:0;S.introErr="";regen();renderSetup();renderPlan();setStatus(t("notSaved"));if(S.intake)setTab("setup");};
  if(S.dirty&&S.savedAt===null&&!S.isExample)confirmBox(t("newQ"),t("newT"),t("startNew"),go);else go();
}


/* ---------- header ---------- */
$("#planName").addEventListener("change",e=>{S.nameAuto=!e.target.value.trim();S.name=e.target.value.trim()||t("trainingBlock");e.target.value=S.name;markDirty();});
$("#btnSave").onclick=()=>savePlan(false);
function setTab(tab){document.body.dataset.tab=tab;document.querySelectorAll("#mtabs [data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));const L=$(".layout"),m=$("#mtabs");if(L&&m){const top=L.getBoundingClientRect().top;const h=m.offsetHeight+12;if(top<h)window.scrollTo({top:Math.max(0,top+scrollY-h)});}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-tabgo]");if(b&&(b.closest("#mtabs")||b.dataset.tabgo))setTab(b.dataset.tab||b.dataset.tabgo);});
$("#btnPlans").onclick=openPlans;
$("#btnNew").onclick=newPlan;

function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml);});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria));});
  $("#langSel").value=LANG;
  syncTheme();
}
function syncTheme(){const v=document.documentElement.dataset.theme||"dark";document.querySelectorAll("#themeSeg [data-theme-v]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeV===v)));}
function setLang(l){
  if(l===LANG||!I18N[l])return;
  const prevName=defaultName();const from=LANG;LANG=l;try{localStorage.setItem("bb-lang",l);}catch(_){}
  DAYS=t("days").split("|");DAYS1=t("days1").split("|");
  translateTypes(S.types,from,l);
  if(S.name===prevName||S.name===I18N[from].trainingBlock){S.name=S.name===prevName?defaultName():t("trainingBlock");$("#planName").value=S.name;}
  if(S.edited){toast(t("langEdited"));}
  else{const wasDirty=S.dirty;regen();if(S.savedAt)markDirty();else S.dirty=wasDirty;}
  applyStatic();renderSetup();renderPlan();
  const st=$("#saveStatus");if(st&&!S.savedAt)setStatus(t("notSaved"));
}
$("#langSel").addEventListener("change",e=>setLang(e.target.value));
$("#themeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-theme-v]");if(!b)return;const v=b.dataset.themeV;document.documentElement.dataset.theme=v;try{localStorage.setItem("bb-theme",v);}catch(_){}syncTheme();});
/* Display and language panel: opens from the gear, closes on Escape (focus back to the gear) or a tap outside */
function setPrefs(open,focusBack){const P=$("#prefsPanel"),B=$("#btnPrefs");P.hidden=!open;B.setAttribute("aria-expanded",String(open));
  if(open)(P.querySelector('[aria-pressed="true"]')||P.querySelector("button,select")).focus({preventScroll:true});else if(focusBack)B.focus({preventScroll:true});}
/* Quick workout from the Goal row (BB-58): an action next to the goal, not a third goal; the plan is left as it is */
$("#btnQuickGoal").addEventListener("click",()=>openQuick());
$("#btnPrefs").addEventListener("click",()=>setPrefs($("#prefsPanel").hidden));
$("#prefs").addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#prefsPanel").hidden){e.stopPropagation();setPrefs(false,true);}});
$("#prefs").addEventListener("focusout",e=>{if(e.relatedTarget&&!$("#prefs").contains(e.relatedTarget))setPrefs(false);});
document.addEventListener("click",e=>{if(!$("#prefsPanel").hidden&&!e.target.closest("#prefs"))setPrefs(false);});

applyStatic();
regen();renderSetup();$("#planName").value=S.name;renderPlan();setStatus(t("notSaved"));
refreshLocalList();
})();
</script>
