<style>
/* Layout: sticky setup rail on the left, plan on the right (volume profile, then week x day grid). Stacks on phones. */
:root{
  /* "Night track": dark is the default. Volt accent only on today's run and the primary action. */
  --bg:#0B0F10; --surface:#131A1C; --surface-2:#1B2427; --ink:#ECF1EE; --muted:#97A5A8; --line:#283336;

  --easy:#4CB98F; --recovery:#93A7A3; --hard:#E66C86; --long:#809EE8; --race:#E2B84A;
  --ph-base:#5E8C7C; --ph-build:#5579AE; --ph-peak:#EE7650; --ph-taper:#C9A447;
  --easy-t:#4CB98F; --recovery-t:#93A7A3; --hard-t:#E66C86; --long-t:#809EE8; --race-t:#E2B84A;
  --ph-base-t:#6A9A89; --ph-build-t:#7392C2; --ph-peak-t:#EE7650; --ph-taper-t:#C9A447;
  --warn-bg:#33270F; --warn-ink:#F2CD86; color-scheme:dark;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
/* Light theme: chosen in the header, or "Auto" on a device set to light. Volt fails as text on light, so lines use olive. */
:root[data-theme="light"]{
  --bg:#F2F5F4; --surface:#FFFFFF; --surface-2:#E9EEEC; --ink:#142027; --muted:#5A6A6F; --line:#D5DDDB;
  --accent:#D4FF3A; --accent-ink:#142027; --accent-btn:#D4FF3A; --accent-line:#557000;
  --easy:#2B8768; --recovery:#7D908C; --hard:#B5384F; --long:#3456A6; --race:#A87A06;
  --ph-base:#8FB2A5; --ph-build:#6C93C8; --ph-peak:#D4542C; --ph-taper:#C9A447;
  --warn-bg:#FFF4E5; --warn-ink:#7A4A00;
  --easy-t:#257459; --recovery-t:#5D6D6A; --hard-t:#B5384F; --long-t:#3456A6; --race-t:#866105;
  --ph-base-t:#557C6D; --ph-build-t:#4575B7; --ph-peak-t:#C44D28; --ph-taper-t:#8B6F29; color-scheme:light}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{

  --accent:#D4FF3A; --accent-ink:#142027; --accent-btn:#D4FF3A; --accent-line:#557000;
  --easy:#2B8768; --recovery:#7D908C; --hard:#B5384F; --long:#3456A6; --race:#A87A06;
  --ph-base:#8FB2A5; --ph-build:#6C93C8; --ph-peak:#D4542C; --ph-taper:#C9A447;

  --ph-base-t:#557C6D; --ph-build-t:#4575B7; --ph-peak-t:#C44D28; --ph-taper-t:#8B6F29; color-scheme:light}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}

@media (pointer:coarse){.icon-btn{width:44px;height:44px}}
.prefs-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:240px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:grid;gap:6px}

.prefs-panel .seg{display:grid;grid-template-columns:repeat(3,1fr)}

.hello{display:flex;align-items:center;gap:16px;padding-block:2px 14px}

.mtabs,.m-only{display:none}

  .mtabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px;font-weight:600;cursor:pointer;min-height:40px}

}
@media (max-width:640px){
  header.top{gap:10px 8px;padding-bottom:10px;margin-bottom:12px}

  .plan-name{order:2}
  #saveStatus{order:3}

  .hello p.lead{font-size:15.5px}
}
@media (pointer:coarse){input,select,textarea,.type-head .tname{font-size:16px}}

.racebox{border:1px dashed var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.racebox.set{border-style:solid;background:var(--surface)}
.racebox .acts{display:flex;flex-wrap:wrap;gap:6px}
.plan-name{text-overflow:ellipsis;font-family:var(--f-display);font-size:20px;font-weight:600;border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:4px;min-width:0;width:min(320px,60vw)}
.plan-name:hover,.plan-name:focus{border-color:var(--line);background:var(--surface)}
.status{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent-btn);color:var(--accent-ink);border-color:var(--accent-line)}

.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}

.sec{border-top:1px solid var(--line);padding-block:14px;display:grid;gap:10px}
.sec:first-child{border-top:0;padding-top:0}

.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
/* iOS WebKit gives date inputs an intrinsic min width that overflows grid cells */
.field input[type=date]{-webkit-appearance:none;appearance:none;max-width:100%;min-height:36px}

.field{display:grid;gap:4px;min-width:0}
.field label,.lbl{font-size:12.5px;color:var(--muted);font-weight:500}

.hint{font-size:12.5px;color:var(--muted)}
.seg{display:flex;flex-wrap:wrap;gap:4px}

.types{display:grid;gap:8px}

.type-head{display:flex;align-items:center;gap:8px}
.type-head input[type=checkbox]{width:17px;height:17px;accent-color:var(--ink);flex:none}

.type-head .tname:focus{border-color:var(--line)}
.kind-dot{width:10px;height:10px;border-radius:50%;flex:none}
.type details summary{cursor:pointer;font-size:12.5px;color:var(--muted)}

.type .opts{display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;background:var(--surface)}
.chip[aria-pressed="true"]{background:var(--surface-2);border-color:var(--ink);font-weight:600}
.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px}
.icon-btn:hover{color:var(--ink)}
code{font-family:var(--f-mono);font-size:12px;background:var(--surface-2);padding:0 4px;border-radius:3px}

.profile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px 8px}
.profile-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 14px;align-items:center;margin-bottom:6px}

.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

@media (pointer:coarse){textarea,.exp select{font-size:16px}}
.exp .btn{border-radius:0 6px 6px 0}
.exp select:hover,.exp select:hover+.btn{border-color:var(--ink)}
.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}

td.day{height:1px;min-height:84px}

td.day .empty .plus{font-weight:600}
td.day:hover .empty .plus,td.day .empty:focus .plus{color:var(--ink)}
td.day:hover .empty,td.day .empty:focus{border-color:var(--line);background:var(--surface-2)}
.ses{position:relative;border-radius:7px;padding:6px 7px 7px 9px;background:var(--surface-2);cursor:grab;display:grid;gap:3px;border:1px solid transparent;text-align:left;width:100%;min-height:76px}
.ses:hover{border-color:var(--line)}
.ses::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--k)}
.ses .t{font-weight:600;font-size:13.5px;line-height:1.2;color:var(--kt,var(--k))}
.ses .k{font-family:var(--f-mono);font-size:12.5px}

.ses.dragging{opacity:.4}
.ses.race{background:color-mix(in srgb,var(--race) 16%,var(--surface))}
tr.wnote td{border-left:0;padding:0 10px 10px 144px;font-size:13.5px;color:var(--ink)}
tr.wnote td p{margin:0;padding:8px 12px;background:var(--surface-2);border-radius:6px;max-width:80ch}

.plans-list{display:grid;gap:6px}

@media (prefers-reduced-motion:no-preference){.ses{transition:border-color .15s}}
/* today: session of the day beside the local forecast */
.today{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);background:var(--surface);border:1px solid var(--accent-line);box-shadow:inset 0 0 0 1px var(--accent-line);border-radius:10px;overflow:hidden}
@media (max-width:760px){.today{grid-template-columns:minmax(0,1fr)}}
.today>div{padding:12px 14px 14px;display:grid;gap:8px;align-content:start;min-width:0}
.today .wxp{border-left:1px solid var(--line);background:color-mix(in srgb,var(--surface-2) 55%,var(--surface))}
@media (max-width:760px){.today .wxp{border-left:0;border-top:1px solid var(--line)}}
.today .eyebrow{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-family:var(--f-display);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.today .eyebrow b{color:var(--ink);font-weight:700}
.tses{position:relative;display:grid;gap:4px;padding:2px 0 2px 12px}
.tses::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--k)}
.tses .tn{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px}
.tses .tn b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;color:var(--kt,var(--k))}
.tses .tn span{font-family:var(--f-mono);font-size:15px}
.tses p{margin:0;font-size:14.5px;max-width:62ch}
.tses .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.today .rest b{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;text-transform:uppercase;color:var(--recovery)}
.today .rest p,.today .tnext{margin:0;font-size:14px;color:var(--muted)}
.today .tnext b{color:var(--ink);font-weight:600}
.wxnow{display:flex;align-items:center;gap:12px;min-width:0}
.wxnow svg{width:40px;height:40px;flex:none;color:var(--ink)}
.wxnow .tmp{font-family:var(--f-display);font-weight:700;font-size:40px;line-height:.9;font-variant-numeric:tabular-nums}
.wxnow .dsc{display:grid;min-width:0;font-size:13.5px}
.wxnow .dsc b{font-weight:600}
.wxnow .dsc span{color:var(--muted)}
.wxfacts{display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.wxfacts b{color:var(--ink);font-weight:500}
.wxhours{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.wxh{flex:1 0 46px;display:grid;justify-items:center;gap:1px;padding:5px 2px;border-radius:6px;border:1px solid transparent;font-variant-numeric:tabular-nums}
.wxh .hr{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.wxh .tp{font-weight:600;font-size:14px}
.wxh .pp{font-family:var(--f-mono);font-size:11px;color:var(--long)}
.wxh.best{border-color:var(--easy);background:color-mix(in srgb,var(--easy) 10%,transparent)}
.wxbest{font-size:13px;color:var(--muted)}
.wxbest b{color:var(--easy);font-weight:600}
.wxloc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.wxloc .icon-btn{font-size:12.5px;text-decoration:underline}
#wxForm{display:flex;flex-wrap:wrap;gap:6px}
#wxForm input{flex:1 1 140px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 9px}

/* ---------- pace model (Daniels/Gilbert VO2 equations) ---------- */
/* Finish time for a recent race. h:mm:ss and mm:ss as written; two parts can also mean h:mm ("1:45" for a half),
   and a lone number means minutes ("52" for a 10K). The reading that gives a plausible result for the race
   distance (VDOT 15-90) wins, mm:ss first. Returns seconds, or null when no reading fits. */
function raceTimeSec(s,km){
  if(s==null||!(km>0))return null;
  const p=String(s).trim().split(":");
  if(!p.length||p.length>3||p.some(x=>!/^\d{1,3}$/.test(x)))return null;
  const n=p.map(Number);if(n.slice(1).some(x=>x>59))return null;
  const cands=n.length===3?[n[0]*3600+n[1]*60+n[2]]:n.length===2?[n[0]*60+n[1],n[0]*3600+n[1]*60]:[n[0]*60];
  for(const sec of cands){if(sec<=0)continue;const vd=vdotOf(km*1000,sec/60);if(vd>15&&vd<90)return sec;}
  return null;
}
const REC_LBL={"5":"l5k","10":"l10k","21.0975":"lhm","42.195":"lm"}, REC_EX={"5":"25:00","10":"52:00","21.0975":"1:55:00","42.195":"4:00:00"};
/* time typed for a chosen race, but no reading fits: say so instead of quietly dropping the paces */
const badRaceTime=inp=>+inp.recDist>0&&String(inp.recTime||"").trim()!==""&&raceTimeSec(inp.recTime,+inp.recDist)==null;
function badTimeMsg(inp){const k=String(+inp.recDist);return t("wa_badTime",{time:String(inp.recTime).trim(),lbl:t(REC_LBL[k]||"l10k"),ex:REC_EX[k]||"52:00"});}
const vo2 = v => -4.60+0.182258*v+0.000104*v*v;
const pctMax = t => 0.8+0.1894393*Math.exp(-0.012778*t)+0.2989558*Math.exp(-0.1932605*t);
const vdotOf = (m,tmin) => vo2(m/tmin)/pctMax(tmin);
const velAt = o => (-0.182258+Math.sqrt(0.182258**2+4*0.000104*(4.60+o)))/(2*0.000104);
function raceTimeMin(vd,m){let lo=3,hi=900;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(vdotOf(m,mid)>vd)lo=mid;else hi=mid;}return (lo+hi)/2;}
const fmtPace = sec => {const s=Math.round(sec);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")+"/km";};
function fmtDur(sec){sec=Math.round(sec);const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+":"+String(m).padStart(2,"0"):m)+":"+String(s).padStart(2,"0");}

function distLabel(inp){if(!inp.dist)return "";return inp.dist==="custom"?(+inp.customKm||10)+" km":t("l"+inp.dist);}
function cat(D){return D<=6?"5k":D<=12?"10k":D<=25?"hm":"m";}

function paces(inp){
  const D=distKm(inp)*1000, rd=+inp.recDist, rt=raceTimeSec(inp.recTime,rd);
  if(rd>0&&rt){
    const vd=vdotOf(rd*1000,rt/60);
    if(vd>15&&vd<90){
      const sp=f=>60000/velAt(vd*f);
      const raceMin=raceTimeMin(vd,D), mMin=raceTimeMin(vd,42195);
      const s={easy:sp(0.70),tempo:sp(0.88),interval:sp(0.975),rep:sp(1.04),race:raceMin*60/(D/1000),mp:mMin*60/42.195};
      return {vdot:vd,raceSec:raceMin*60,sec:s,txt:Object.fromEntries(Object.entries(s).map(([k,v])=>[k,fmtPace(v)]))};
    }
  }
  const sec={easy:400,tempo:330,interval:305,rep:290,race:330,mp:345};
  return {vdot:null,sec,txt:Object.fromEntries(["easy","tempo","interval","rep","race","mp"].map(k=>[k,t("pe_"+k)]))};
}

/* ---------- plan engine ---------- */
function effectiveDays(inp){
  const d=[...new Set(inp.days)].filter(x=>x>=0&&x<7).sort((a,b)=>a-b);
  return d.length===inp.runs?d:DEFAULT_DAYS[inp.runs].slice();
}
function cyc(a,b){const x=Math.abs(a-b);return Math.min(x,7-x);}
function* combos(arr,k,start=0,acc=[]){if(acc.length===k){yield acc.slice();return;}for(let i=start;i<arr.length;i++){acc.push(arr[i]);yield* combos(arr,k,i+1,acc);acc.pop();}}
function pickHardDays(cands,k,longD,raceWeek){
  if(k<=0)return [];
  let best=null,bp=Infinity;
  for(const c of combos(cands,Math.min(k,cands.length))){
    let p=0;
    for(let i=0;i<c.length;i++){
      if(cyc(c[i],longD)<=1)p+=(c[i]===(longD+6)%7?6:10);
      for(let j=i+1;j<c.length;j++)if(cyc(c[i],c[j])<=1)p+=12;
      if(raceWeek){const before=(longD-c[i]+7)%7;if(before<3)p+=30;p+=Math.abs(before-4);}
    }
    if(p<bp){bp=p;best=c;}
  }
  return best||[];
}

function workFor(ty,ctx){
  const {p,D,c,taper,P}=ctx; const tf=(taper?0.65:1)*(ctx.scale||1); const S=P.sec;
  switch(ty.id){
    case "tempo":{let mins=Math.round((15+15*p)*tf);if(c==="5k")mins=Math.min(mins,24);
      if(p<0.35&&!taper){const n=Math.max(2,Math.round(mins/8));return {text:t("w_tempoCruise",{n}),km:n*8*60/S.tempo+n*0.25,wucd:4,main:[{n,steps:[{p:'work',g:['t',480],pace:'tempo'},{p:'recovery',g:['t',90],pace:null}]}]};}
      return {text:t("w_tempoCont",{mins}),km:mins*60/S.tempo,wucd:4,main:[{n:1,steps:[{p:'work',g:['t',mins*60],pace:'tempo'}]}]};}
    case "intervals":{const sets={"5k":[400,800,1000],"10k":[800,1000,1200],"hm":[1000,1200,1600],"m":[1000,1600,2000]}[c];
      const rep=sets[p<0.34?0:p<0.67?1:2]; const tot=((c==="5k"||c==="10k")?3+2.5*p:4+3*p)*tf;
      const n=clamp(Math.round(tot*1000/rep),3,12); const rec=t(rep<=800?"jog90":rep<=1200?"jog120":"jog180"); const recS=rep<=800?90:rep<=1200?120:180;
      return {text:t("w_int",{n,rep,rec}),km:n*rep/1000+n*0.3,wucd:4,main:[{n,steps:[{p:'work',g:['d',rep/1000],pace:rep<=400?'rep':'interval'},{p:'recovery',g:['t',recS],pace:null}]}]};}
    case "hills":{const n=Math.round((6+4*p)*tf);return {text:t("w_hills",{n}),km:n*0.55,wucd:4,main:[{n,steps:[{p:'work',g:['t',75],pace:null},{p:'recovery',g:['t',120],pace:null}]}]};}
    case "fartlek":{if(p<0.5){const n=Math.round((8+4*p*2)*tf);return {text:t("w_fart1",{n}),km:n*2*60/S.easy*1.15,wucd:4,main:[{n,steps:[{p:'work',g:['t',60],pace:null},{p:'recovery',g:['t',60],pace:null}]}]};}
      const n=Math.round(6*tf);return {text:t("w_fart2",{n}),km:n*3*60/S.easy*1.2,wucd:4,main:[{n,steps:[{p:'work',g:['t',120],pace:'interval'},{p:'recovery',g:['t',60],pace:null}]}]};}
    case "progression":{const x=Math.round(2+3*p);return {text:t("w_prog",{x}),km:null,wucd:0,fast:x,fastPace:'tempo'};}
    case "racepace":{
      if(c==="m"){const k=Math.max(5,Math.round((8+8*p)*(taper?0.5:1)*(ctx.scale||1)));return {text:t("w_rpM",{k}),km:k,wucd:4,main:[{n:1,steps:[{p:'work',g:['d',k],pace:'mp'}]}]};}
      const blk={"5k":[1,3,2,t("jog90")],"10k":[2,2,2,t("jog120")],"hm":[3,2,1,t("jog120")]}[c];
      const n=Math.max(2,Math.round((blk[1]+blk[2]*p)*tf));
      return {text:t("w_rp",{n,b:blk[0],rec:blk[3]}),km:n*blk[0]+n*0.3,wucd:4,main:[{n,steps:[{p:'work',g:['d',blk[0]],pace:'race'},{p:'recovery',g:['t',blk[0]===1?90:120],pace:null}]}]};}
    case "strides":{const n=6+Math.round(2*p);return {text:t("w_strides",{n}),km:0,wucd:0,strides:n};}
    case "long":{
      if(ctx.phase==="peak"&&(c==="hm"||c==="m")&&!ctx.cut){const x=c==="hm"?Math.round(3+2*p):Math.round(6+4*p);return {text:t("w_longFast",{x}),fast:x,fastPace:'race'};}
      if(c==="m"||c==="hm")return {text:t("w_longFuel")};
      return {text:ctx.phase==="peak"?t("w_longPick"):""};
    }
  }
  return {text:"",km:null,wucd:0};
}
function fill(tpl,tok){return String(tpl||"").replace(/\{(\w+)\}/g,(m,k)=>tok[k]!==undefined?tok[k]:m).replace(/\s+/g," ").replace(/\s+([.,])/g,"$1").replace(/,\s*,/g,",").trim();}

/* structured workout for Apple Watch: {wu,cd,blocks:[{n,steps:[{p,g:['d',km]|['t',sec],pace}]}]} */
function watchPlan(kind,km,w){
  w=w||{};const easy=(k,pace)=>({p:'work',g:['d',r05(Math.max(0.5,k))],pace});
  if(kind==="race")return {blocks:[{n:1,steps:[{p:'work',g:['d',km],pace:'race'}]}]};
  if(w.main){const plan={blocks:w.main.map(b=>({n:b.n,steps:b.steps.map(x=>({...x,g:[...x.g]}))}))};if(w.wucd){plan.wu=['d',w.wucd/2];plan.cd=['d',w.wucd/2];}return plan;}
  if(w.strides)return {blocks:[{n:1,steps:[easy(km,'easy')]},{n:w.strides,steps:[{p:'work',g:['t',20],pace:null},{p:'recovery',g:['t',60],pace:null}]}]};
  if(w.fast&&km>w.fast)return {blocks:[{n:1,steps:[easy(km-w.fast,'easy'),easy(w.fast,w.fastPace)]}]};
  return {blocks:[{n:1,steps:[easy(km,kind==="recovery"?null:'easy')]}]};
}

function generate(inp,types){
  const D=distKm(inp), c=cat(D), P=paces(inp);
  const W=clamp(Math.round(+inp.weeks||12),3,30);
  const runs=clamp(+inp.runs||5,1,7);
  const noRace=inp.goal==="fitness";
  const taperN=noRace?0:Math.min({"5k":1,"10k":1,"hm":2,"m":3}[c],Math.max(1,Math.floor(W/4)));
  const nb=W-taperN;
  const nBase=Math.max(1,Math.round(nb*0.4)), nPeak=Math.max(1,Math.round(nb*0.25)), nBuild=Math.max(0,nb-nBase-nPeak);
  const phaseOf=i=>i>=nb?"taper":i<nBase?"base":i<nBase+nBuild?"build":"peak";
  const cut=i=>i<nb-1&&nb>=5&&(i+1)%4===0;
  const V0=clamp(+inp.curVol||25,5,200);
  const fac={"5k":1.25,"10k":1.3,"hm":1.4,"m":1.55}[c], floor={"5k":20,"10k":25,"hm":32,"m":45}[c], perRun=c==="m"?16:13;
  let peakV=Math.max(V0,Math.min(Math.max(V0*fac,floor),runs*perRun));
  let nNC=0;for(let i=0;i<nb;i++)if(!cut(i))nNC++;
  const g=nNC>1?Math.min(0.1,Math.pow(peakV/V0,1/(nNC-1))-1):0;
  peakV=Math.min(peakV,V0*Math.pow(1+g,Math.max(0,nNC-1)));
  const vols=[];let k=0,last=V0;
  for(let i=0;i<nb;i++){if(cut(i)){vols.push(last*0.8);}else{last=Math.min(peakV,V0*Math.pow(1+g,k));k++;vols.push(last);}}
  const tm={0:[],1:[0.6],2:[0.75,0.55],3:[0.8,0.65,0.5]}[taperN];
  for(let j=0;j<taperN;j++)vols.push(peakV*tm[j]);
  const L0=clamp(+inp.curLong||10,3,45);
  const Lpk=Math.max(L0,{"5k":12,"10k":16,"hm":19,"m":32}[c]);
  const lfrac=Math.max({"5k":0.33,"10k":0.33,"hm":0.38,"m":0.48}[c],1.25/runs);
  const on=types.filter(t=>t.on);
  const hardTypes=on.filter(t=>t.kind==="hard");
  const recT=on.find(t=>t.kind==="recovery"), stridesT=on.find(t=>t.id==="strides");
  const easyT=types.find(t=>t.id==="easy"), longT=types.find(t=>t.id==="long");
  const raceD=parseISO(inp.raceDate), raceDow=dow(raceD);
  const start=noRace?(d=>addDays(d,(7-dow(d))%7))(parseISO(inp.startDate||nextMonday())):addDays(raceD,-raceDow-7*(W-1));
  const rot={}; const occ={};
  const weeks=[];
  let refKm=null; /* actual km of the last week that was neither a cutback nor taper */
  let longPk=0; /* longest long run actually built before the taper: the taper scales from it, not from the target peak (BB-39) */
  for(let i=0;i<W;i++){
    const phase=phaseOf(i), isCut=cut(i), raceWeek=!noRace&&i===W-1;
    const p=nb>1?clamp(i/(nb-1),0,1):1;
    let days=effectiveDays({...inp,runs});
    let longD=+inp.longDay;
    if(!days.includes(longD))longD=days[days.length-1];
    if(raceWeek){if(!days.includes(raceDow)){const idx=days.indexOf(longD);days[idx]=raceDow;days.sort((a,b)=>a-b);}longD=raceDow;}
    let hk=runs<=4?1:(phase==="base"||phase==="taper"?1:2);
    if(isCut)hk=Math.max(1,hk-1);
    if(!hardTypes.length)hk=0;
    if(raceWeek&&runs<=3)hk=0;
    const others=days.filter(d=>d!==longD);
    const hardDays=pickHardDays(others,Math.min(hk,others.length),longD,raceWeek);
    const target=vols[i];
    const ctxBase={p:phase==="taper"?0.5:p,D,c,taper:phase==="taper",P,phase,cut:isCut};
    const sessions=[];
    // long / race
    let longKm,mkLong=null;
    if(raceWeek){sessions.push({id:uid(),day:longD,typeId:"race",name:t("raceDay"),kind:"race",km:+D.toFixed(1),desc:raceDesc(inp,P),note:"",watch:watchPlan("race",+D.toFixed(1))});}
    else{
      if(phase==="taper"){const pk=longPk||Lpk;longKm=pk*([0.75,0.6][i-nb]||0.6);}
      else{const nbNC=Math.max(1,nb-1);longKm=L0+(Lpk-L0)*Math.min(1,i/nbNC);longKm=Math.min(longKm,Math.max(L0*0.9,target*lfrac));if(isCut)longKm*=0.75;}
      longKm=r05(Math.max(longKm,4));
      const lt=longT.on?longT:easyT; /* long run type unticked: that day is a plain easy run */
      const w=longT.on?workFor(longT,ctxBase):{text:""};
      mkLong=km=>({id:uid(),day:longD,typeId:lt.id,name:lt.name,kind:lt.kind,km,desc:fill(lt.tpl,{...P.txt,km,work:fill(w.text,P.txt)}),note:"",watch:watchPlan(lt.kind,km,w)});
      sessions.push(mkLong(longKm));
    }
    // hard
    const elig=hardTypes.filter(t=>t.phases.includes(phase));
    let pool=elig.length?elig:hardTypes;
    if(raceWeek){const rp=hardTypes.filter(t=>t.id==="racepace"||t.id==="tempo");if(rp.length)pool=rp;}
    if(phase==="peak"){pool=[...pool].sort((a,b)=>(b.id==="racepace")-(a.id==="racepace"));}
    const used=new Set();
    const picks=[];
    for(const d of hardDays){
      let t=null;rot[phase]=rot[phase]||0;
      for(let tries=0;tries<pool.length;tries++){const cand=pool[(rot[phase]++)%pool.length];if(!used.has(cand.id)||pool.length<=used.size){t=cand;break;}}
      if(!t)t=pool[0];used.add(t.id);picks.push({d,t});
    }
    const easyN=days.length-1-picks.length;
    const build=scale=>picks.map(({d,t})=>{
      const w=workFor(t,{...ctxBase,scale,taper:phase==="taper"||raceWeek});
      let km;
      if(w.km==null){km=clamp(Math.round(target*0.17*scale),6,16);if(raceWeek)km=Math.min(km,8);}
      else km=w.wucd+w.km;
      if(raceWeek)km=Math.min(km,c==="m"?14:9);
      km=r05(Math.max(km,5));
      return {id:uid(),day:d,typeId:t.id,name:t.name,kind:"hard",km,desc:fill(t.tpl,{...P.txt,km,work:fill(w.text,P.txt)}),note:"",watch:watchPlan("hard",km,w)};
    });
    let hs=build(1),hScale=1;
    let hardKm=hs.reduce((a,x)=>a+x.km,0);
    const room=target*1.04-(longKm||0)-easyN*4;
    if(!raceWeek&&hardKm>room&&hardKm>0){hScale=clamp(room/hardKm,0.55,1);hs=build(hScale);hardKm=hs.reduce((a,x)=>a+x.km,0);}
    // easy
    const easyDays=others.filter(d=>!hardDays.includes(d));
    const roles=easyDays.map(d=>({d,t:easyT}));
    const afterLong=(longD+1)%7;
    if(recT&&runs>=5&&!raceWeek){const r=roles.find(x=>x.d===afterLong)||(roles.length>1?roles.find(x=>cyc(x.d,longD)===1):null);if(r)r.t=recT;}
    if(stridesT){const s=(raceWeek?roles.find(x=>x.d===(longD+6)%7):null)||roles.find(x=>x.t===easyT&&x.d!==afterLong)||roles.find(x=>x.t===easyT);if(s)s.t=stridesT;}
    const wt=x=>x.t.kind==="recovery"?0.7:1;
    const sumW=roles.reduce((a,x)=>a+wt(x),0)||1;
    const rem=Math.max(0,target-(longKm||0)-hardKm);
    const minKm=x=>x.t.kind==="recovery"?3:4;
    const easyKm=roles.map(x=>{
      let km;
      if(raceWeek){km=(x.d===(longD+6)%7)?(c==="m"?5:4):clamp(Math.round(peakV*0.09),4,8);}
      else km=Math.max(minKm(x),rem*wt(x)/sumW);
      if(!raceWeek&&x.t.kind!=="recovery")km=Math.min(km,Math.max(longKm-1,6));
      return r05(km);
    });
    /* Rounding and the minimum distances can push a week well past +10% on the last full week.
       Trim back to that cap: easy runs first (0.5 km steps, longest first), then the hard runs, then the long run. */
    if(!raceWeek&&!isCut&&phase!=="taper"&&refKm!=null){
      const cap=refKm*1.1+0.01;
      const total=()=>(longKm||0)+hardKm+easyKm.reduce((a,b)=>a+b,0);
      while(total()>cap){
        let j=-1;easyKm.forEach((k,i)=>{if(k-0.5>=minKm(roles[i])&&(j<0||k>easyKm[j]))j=i;});
        if(j<0)break;easyKm[j]-=0.5;
      }
      for(let sc=hScale-0.05;total()>cap&&hs.length&&sc>=0.549;sc-=0.05){const h2=build(sc),k2=h2.reduce((a,x)=>a+x.km,0);if(k2<hardKm){hs=h2;hardKm=k2;}}
      if(total()>cap&&mkLong){const nl=Math.max(4,Math.floor((longKm-(total()-cap))*2)/2);if(nl<longKm){longKm=nl;sessions[0]=mkLong(longKm);}}
    }
    sessions.push(...hs);
    roles.forEach((x,i)=>{
      const km=easyKm[i];const w=workFor(x.t,ctxBase);
      sessions.push({id:uid(),day:x.d,typeId:x.t.id,name:x.t.name,kind:x.t.kind,km,desc:fill(x.t.tpl,{...P.txt,km,work:fill(w.text||"",P.txt)}),note:"",watch:watchPlan(x.t.kind,km,w)});
    });
    if(!isCut&&phase!=="taper")refKm=sessions.reduce((a,x)=>a+x.km,0);
    if(phase!=="taper"&&longKm)longPk=Math.max(longPk,longKm);
    sessions.sort((a,b)=>a.day-b.day);
    weeks.push({n:i+1,phase,cutback:isCut,start:iso(addDays(start,7*i)),target:Math.round(target),note:"",sessions});
  }
  return {weeks,meta:{noRace,D,c,taperN,peakV:Math.round(peakV),start:iso(start),vdot:P.vdot,raceSec:P.raceSec||null,racePace:P.vdot?P.txt.race:null}};
}
function raceDesc(inp,P){
  const lbl=distLabel(inp);
  if(P.vdot)return cap(t("raceDescV",{lbl,time:fmtDur(P.raceSec),pace:P.txt.race}));
  return cap(t("raceDescE",{lbl}));
}

/* ---------- warnings ---------- */
function warnings(inp,types,plan,edited){
  const w=[];const D=distKm(inp),c=cat(D),lbl=distLabel(inp);
  const minW={"5k":6,"10k":8,"hm":10,"m":14}[c];
  if(inp.goal!=="fitness"&&inp.weeks<minW)w.push(t("wa_short",{w:inp.weeks,lbl,min:minW}));
  if(inp.weeks>24)w.push(t("wa_long",{n:Math.min(20,inp.weeks)}));
  const lowVol={"5k":12,"10k":18,"hm":22,"m":32}[c];
  if(inp.goal!=="fitness"&&+inp.curVol<lowVol)w.push(t("wa_lowVol",{v:inp.curVol,lbl}));
  if(inp.goal!=="fitness"&&c==="m"&&+inp.curLong<14)w.push(t("wa_mLong"));
  /* goal readiness (BB-40): longest run before race day and biggest week, against what a half or marathon usually needs */
  if(inp.goal!=="fitness"&&(c==="hm"||c==="m")&&plan.weeks.length){
    const pre=plan.weeks.filter(x=>!x.sessions.some(s=>s.kind==="race"));
    const lr=Math.max(0,...pre.flatMap(x=>x.sessions.map(s=>+s.km||0)));
    const pk=Math.max(0,...pre.map(x=>x.sessions.reduce((a,s)=>a+(+s.km||0),0)));
    const tl=D*(c==="m"?.75:.6),tp=c==="m"?45:30;
    if(lr<tl-.05||pk<tp-.05)w.push(t("wa_ready",{long:+lr.toFixed(1),peak:Math.round(pk),lbl,tl:Math.round(tl),tp}));
  }
  const days=[...new Set(inp.days)];
  if(days.length!==+inp.runs)w.push(t("wa_days",{d:days.length,r:inp.runs}));
  const hard=types.filter(x=>x.on&&x.kind==="hard");
  const maxHard=+inp.runs<=4?1:2;
  if(hard.length>maxHard*2)w.push(t("wa_tooMany",{h:hard.length,r:inp.runs,m:maxHard,sess:t(maxHard>1?"sessMany":"sessOne")}));
  if(!hard.length)w.push(t("wa_noHard"));
  /* +10% a week on the last full week (cutbacks and taper skipped), checked on the weeks as shown */
  const wk=plan.weeks.map(x=>x.sessions.reduce((a,s)=>a+(+s.km||0),0));const steep=[];
  plan.weeks.forEach((x,i)=>{if(i===0||x.cutback||x.phase==="taper")return;const r=plan.weeks[i-1].cutback?wk[i-2]:wk[i-1];if(r>0&&wk[i]>r*1.1+0.05)steep.push(x.n);});
  if(steep.length)w.push(t(edited?"wa_steepEdit":"wa_steep",{w:t(steep.length>1?"wkMany":"wkOne",{n:steep.join(", ")})}));
  if(badRaceTime(inp))w.push(badTimeMsg(inp));
  else if(!(+inp.recDist>0&&raceTimeSec(inp.recTime,+inp.recDist)))w.push(t("wa_noPace"));
  const startD=parseISO(plan.meta.start);const today=new Date();today.setHours(0,0,0,0);
  if(startD<addDays(today,-6))w.push(t(inp.goal==="fitness"?"wa_pastFit":"wa_past",{d:fmtDate(startD)}));
  return w;
}

/* ---------- state ---------- */
const S={nameAuto:true,inputs:DEFAULT_INPUTS(),types:DEFAULT_TYPES(),plan:null,planId:uid(),name:cap(t("blockName",{lbl:t("lhm")})),edited:false,savedAt:null,isExample:true,saved:[],saving:false,dirty:false};
function regen(){const g=generate(genInputs(S.inputs),S.types);S.plan=g;S.edited=false;}

/* ---------- setup UI ---------- */
function renderSetup(){
  const I=S.inputs;
  $("#distSeg").innerHTML=DISTS.map(d=>`<button type="button" data-dist="${d.k}" aria-pressed="${I.dist===d.k}">${t("d"+d.k)}</button>`).join("");
  $("#customRow").hidden=I.dist!=="custom";
  $("#customKm").value=I.customKm;
  $("#raceDate").value=I.raceDate;$("#weeks").value=I.weeks;$("#startDate").value=I.startDate||nextMonday();
  const fit=I.goal==="fitness";
  document.querySelectorAll("#goalSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.goal===(fit?"fitness":"race")));

function wmoKey(c){c=+c;if(c===0)return 0;if(c===1)return 1;if(c===2)return 2;if(c===3)return 3;if(c===45||c===48)return 45;if(c>=51&&c<=55)return 51;if(c===56||c===57)return 56;if(c===61||c===63)return 61;if(c===65)return 65;if(c===66||c===67)return 66;if(c>=71&&c<=77)return 71;if(c>=80&&c<=82)return 80;if(c===85||c===86)return 85;if(c>=95)return 95;return 3;}
function wxIcon(c){const k=wmoKey(c);const sun=`<circle cx="20" cy="20" r="7" fill="none" stroke="currentColor" stroke-width="2.4"/><g stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 4v4M20 32v4M4 20h4M32 20h4M8.7 8.7l2.8 2.8M28.5 28.5l2.8 2.8M8.7 31.3l2.8-2.8M28.5 11.5l2.8-2.8"/></g>`;

function renderHello(){
  const el=$("#hello");if(!el)return;
  const P=S.plan,I=S.inputs;
  const today=new Date();today.setHours(12,0,0,0);
  const race=parseISO(I.raceDate);const days=Math.round((race-today)/864e5);
  const lbl=distLabel(I);
  let line;
  const R0=I.race&&I.race.name?I.race:null;
  if(I.goal==="fitness"){
    const st0=parseISO(P.weeks[0].start),end=addDays(st0,7*P.weeks.length-1);
    const wi=P.weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
    if(today<st0)line=t("hFitStarts",{n:P.weeks.length,d:fmtDate(st0)});
    else if(wi<0)line=t("hFitDone",{n:P.weeks.length,d:fmtDate(end)});
    else{const w=P.weeks[wi];const tdow=dow(today);
      const next=w.sessions.find(s=>s.day>=tdow)||(P.weeks[wi+1]&&P.weeks[wi+1].sessions[0]);
      const when=next?(next.day===tdow&&w.sessions.includes(next)?t("today"):DAYS[next.day]):"";
      line=t("hFitIn",{n:w.n,t:P.weeks.length,phase:phaseLbl(w.phase),cut:w.cutback?t("hCut"):""})+(next?t("hNext",{when,name:esc(next.name.toLowerCase()),km:next.km}):"");}
  }
  else if(days<0)line=t("hPast",{lbl:esc(lbl),d:fmtDate(race)});
  else if(days===0)line=t("hToday",{lbl:esc(lbl)});
  else{
    const wi=P.weeks.findIndex(w=>{const st=parseISO(w.start);return today>=st&&today<addDays(st,7);});
    const head=t(days===1?"hDay1":"hDays",{n:days,lbl:esc(lbl),d:fmtDate(race)});
    if(wi<0){line=head+" "+t("hStarts",{d:fmtDate(parseISO(P.weeks[0].start))});}
    else{
      const w=P.weeks[wi];const tdow=dow(today);
      const next=w.sessions.find(s=>s.day>=tdow)||(P.weeks[wi+1]&&P.weeks[wi+1].sessions[0]);
      const when=next?(next.day===tdow&&w.sessions.includes(next)?t("today"):DAYS[next.day]):"";
      line=head+" "+t("hInWeek",{n:w.n,t:P.weeks.length,phase:phaseLbl(w.phase),cut:w.cutback?t("hCut"):""})+(next?t("hNext",{when,name:esc(next.name.toLowerCase()),km:next.km}):"");
    }
  }
  const R=I.race;let cd="";
  if(I.goal!=="fitness"&&R&&R.name&&days>=0){
    const nm=R.url?`<a class="rn" href="${esc(R.url)}" target="_blank" rel="noopener">${esc(R.name)}</a>`:`<span class="rn">${esc(R.name)}</span>`;
    cd=`<div class="countdown"><div class="num">${days}<small>${days===1?t("dayOne"):t("dayMany")}</small></div>${nm}<span class="rm">${R.city?esc(R.city)+" · ":""}${fmtDay(race)} · ${esc(lbl)}</span></div>`;
  }
  el.innerHTML=`<div class="txt"><p class="lead">${line}</p></div>${cd}`;
}

/* ---------- modal helpers ---------- */
/* dialogs: named by their heading, Tab stays inside, focus goes back to the opener on close */
let modalOpener=null,lastTrigger=null;
/* Safari doesn't focus a button on click, so remember the last control pressed */
document.addEventListener("pointerdown",e=>{const c=e.target.closest&&e.target.closest("button,a[href],[tabindex]");if(c&&!c.closest("#modalRoot"))lastTrigger=c;},true);
function openerKey(el){if(el.id)return "#"+CSS.escape(el.id);const at=["data-act","data-w","data-s","data-d"].filter(a=>el.hasAttribute(a));return at.length?at.map(a=>`[${a}="${CSS.escape(el.getAttribute(a))}"]`).join(""):null;}
function modal(html,onMount){const root=$("#modalRoot");if(!root.firstChild){const a=document.activeElement;const o=a&&a!==document.body&&!a.closest("#modalRoot")?a:lastTrigger;modalOpener=o?{el:o,key:openerKey(o)}:null;}
  root.innerHTML=`<div class="modal-bg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`;const bg=root.firstChild;bg.addEventListener("click",e=>{if(e.target===bg)closeModal();});const m=bg.firstChild;
  const h=m.querySelector("h2");if(h){h.id="modalTitle";m.setAttribute("aria-labelledby","modalTitle");}
  onMount&&onMount(m);m.tabIndex=-1;m.focus({preventScroll:true});return m;}
function closeModal(){$("#modalRoot").innerHTML="";const o=modalOpener;modalOpener=null;if(!o)return;
  /* wait until the caller has redrawn the page, and skip if another dialog opened meanwhile */
  queueMicrotask(()=>{if($("#modalRoot").firstChild)return;const el=o.el.isConnected?o.el:(o.key&&document.querySelector(o.key));if(el&&typeof el.focus==="function")el.focus({preventScroll:true});});}
function modalFocusables(m){return [...m.querySelectorAll('a[href],button,input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(el=>!el.disabled&&el.getClientRects().length);}
document.addEventListener("keydown",e=>{const m=$("#modalRoot .modal");if(!m)return;
  if(e.key==="Escape"){closeModal();return;}
  if(e.key!=="Tab")return;const f=modalFocusables(m);if(!f.length){e.preventDefault();m.focus();return;}
  /* move focus ourselves: Safari skips buttons on Tab, which would let focus leave the dialog */
  e.preventDefault();const i=f.indexOf(document.activeElement);
  const n=i<0?(e.shiftKey?f.length-1:0):(i+(e.shiftKey?-1:1)+f.length)%f.length;f[n].focus();});
function confirmBox(title,text,okLabel,ok){modal(`<h2>${esc(title)}</h2><p style="margin:0">${esc(text)}</p><div class="actions"><button class="btn" id="cNo">${t("cancel")}</button><button class="btn primary" id="cYes">${esc(okLabel)}</button></div>`,m=>{m.querySelector("#cNo").onclick=closeModal;m.querySelector("#cYes").onclick=()=>{closeModal();ok();};});}
function toast(msg){const t=document.createElement("div");t.className="toast";t.textContent=msg;$("#toastRoot").appendChild(t);setTimeout(()=>t.remove(),Math.max(2600,msg.length*60));}

/* ---------- Apple Watch (.workout via WorkoutKit format) ---------- */
const PACE_TOL={easy:25,tempo:8,interval:8,rep:6,race:6,mp:8};
const paceLbl=k=>t("pl_"+k);
function gTxt(g){if(g[0]==='d'){const m=Math.round(g[1]*1000);return m<1000||m%1000?(m>=1000?(m/1000).toLocaleString(LOC(),{maximumFractionDigits:1})+" km":m+" m"):m/1000+" km";}const z=g[1];return z>=60?(z%60?Math.floor(z/60)+":"+String(z%60).padStart(2,"0")+" min":z/60+" min"):z+" s";}
function stepTxt(x,P){return gTxt(x.g)+(x.pace?" @ "+(P.vdot?P.txt[x.pace]:paceLbl(x.pace)):"")+(x.p==="recovery"?t("recoverySfx"):"");}
function watchSummary(wp){const P=paces(S.inputs);const parts=[];if(wp.wu)parts.push(t("warmup")+" "+gTxt(wp.wu));
  for(const b of wp.blocks){const st=b.steps.map(x=>stepTxt(x,P)).join(", ");parts.push(b.n>1?`${b.n} × (${st})`:st);}
  if(wp.cd)parts.push(t("cooldown")+" "+gTxt(wp.cd));return parts.join(" · ");}
function rescaleWatch(wp,delta){wp=JSON.parse(JSON.stringify(wp));
  if(wp.wu&&wp.cd){wp.cd=['d',r05(Math.max(0.5,wp.cd[1]+delta))];return wp;}

const FIT_CRC=[0x0000,0xCC01,0xD801,0x1400,0xF001,0x3C00,0x2800,0xE401,0xA001,0x6C00,0x7800,0xB401,0x5000,0x9C01,0x8801,0x4400];

function fitEncodeWorkout(name,steps){
  // steps: [{name,dur:'time'|'distance'|'open'|'repeat',val,target:{lo,hi}|null,intensity,repeatFrom,reps}]
  const out=[];const push=(...a)=>{for(const x of a)out.push(x&0xFF);};
  const u16=v=>[v&0xFF,(v>>8)&0xFF], u32=v=>[v&0xFF,(v>>>8)&0xFF,(v>>>16)&0xFF,(v>>>24)&0xFF];
  const str=(s,n)=>{const b=Array.from(new TextEncoder().encode(String(s||""))).slice(0,n-1);while(b.length<n)b.push(0);return b;};
  // file_id (local 0)
  push(0x40,0,0,...u16(0),5, 0,1,0x00, 1,2,0x84, 2,2,0x84, 3,4,0x8C, 4,4,0x86);
  const created=Math.floor(Date.now()/1000)-631065600;
  push(0x00,5,...u16(255),...u16(0),...u32(Math.floor(Math.random()*0xFFFFFFF)+1),...u32(created));
  // workout (local 1)
  push(0x41,0,0,...u16(26),3, 8,24,0x07, 4,1,0x00, 6,2,0x84);
  push(0x01,...str(name,24),1,...u16(steps.length));
  // workout_step (local 2)
  push(0x42,0,0,...u16(27),9, 254,2,0x84, 0,16,0x07, 1,1,0x00, 2,4,0x86, 3,1,0x00, 4,4,0x86, 5,4,0x86, 6,4,0x86, 7,1,0x00);
  const DUR={time:0,distance:1,open:5,repeat:6};
  steps.forEach((s,i)=>{
    let dv=0xFFFFFFFF,tt=2,tv=0,lo=0,hi=0;
    if(s.dur==="time")dv=Math.round(s.val*1000);
    else if(s.dur==="distance")dv=Math.round(s.val*100);
    else if(s.dur==="repeat"){dv=s.repeatFrom;tt=2;tv=s.reps;}
    if(s.dur==="repeat"){tt=0xFF;lo=0xFFFFFFFF;hi=0xFFFFFFFF;}else if(s.target){tt=0;tv=0;lo=Math.round(s.target.lo*1000);hi=Math.round(s.target.hi*1000);}else{lo=0xFFFFFFFF;hi=0xFFFFFFFF;}

  return file;
}

function fitSteps(wp){
  const P=paces(S.inputs),out=[];
  const goal=g=>g[0]==='d'?{dur:"distance",val:g[1]*1000}:{dur:"time",val:g[1]};
  const tgt=pace=>{if(!pace||!P.vdot)return null;const sec=P.sec[pace],tol=PACE_TOL[pace];return {lo:1000/(sec+tol),hi:1000/(sec-tol)};};
  const lbl=x=>x.pace?(P.vdot?P.txt[x.pace]:paceLbl(x.pace)):(x.p==="recovery"?t("recover"):t("run"));
  if(wp.wu)out.push({name:t("warmup"),...goal(wp.wu),target:null,intensity:2});
  for(const b of wp.blocks){const from=out.length;
    for(const x of b.steps)out.push({name:lbl(x),...goal(x.g),target:tgt(x.pace),intensity:x.p==="recovery"?4:0});
    if(b.n>1)out.push({name:"",dur:"repeat",repeatFrom:from,reps:b.n});}
  if(wp.cd)out.push({name:t("cooldown"),...goal(wp.cd),target:null,intensity:3});
  return out;
}

async function exportWorkouts(dev,list,zipBase){
  const D=DEVICES.find(d=>d.k===dev);
  if(dev==="apple"){try{await loadWK();}catch(_){toast(t("wkLoadFail"));return;}}
  const files=[];
  for(const {w,s} of list){
    const base=`w${String(w.n).padStart(2,"0")}-${DAYS[s.day].toLowerCase()}-${slug(s.name)}`;
    try{
      const wp=s.watch||watchPlan(s.kind,s.km);
      const data=dev==="apple"?new Uint8Array(await (await workoutBlob(w,s)).arrayBuffer()):fitEncodeWorkout(`W${w.n} ${s.name} ${s.km}k`,fitSteps(wp));
      files.push({name:`${base}.${D.ext}`,data});
    }catch(e){console.error(e);toast(t("buildFail",{name:s.name,m:(e&&e.message)||t("unknownErr")}));return;}
  }
  if(!files.length)return;
  const name=(zipBase||files[0].name.replace(/\.\w+$/,""))+"-"+D.k;
  try{dlSave({filename:name+".zip",data:makeZip(files)});toast(t(files.length>1?"savedMany":"savedOne",{n:files.length,dev:D.name(),help:D.help()}));}

  const blocks=[];
  for(const b of wp.blocks.slice(0,50)){
    if(!b||!Array.isArray(b.steps)||!b.steps.length)return undefined;
    const steps=[];
    for(const x of b.steps.slice(0,20)){const g=x&&nGoal(x.g);if(!g)return undefined;steps.push({p:x.p==="recovery"?"recovery":"work",g,pace:PACES.includes(x.pace)?x.pace:null});}
    blocks.push({n:Math.round(nNum(b.n,1,50,1)),steps});
  }
  const out={blocks};const wu=nGoal(wp.wu),cd=nGoal(wp.cd);if(wu)out.wu=wu;if(cd)out.cd=cd;return out;
}
function normalizeSaved(p){
  if(!p||typeof p!=="object"||!p.inputs||typeof p.inputs!=="object"||!Array.isArray(p.types)||!p.plan||!Array.isArray(p.plan.weeks))return null;
  const d=DEFAULT_INPUTS(),I=p.inputs;
  const opt=(v,a,b)=>v===""?"":nNum(v,a,b,"");
  const inputs={...d,goal:I.goal==="fitness"?"fitness":"race",startDate:nIso(I.startDate,d.startDate),dist:DISTS.some(x=>x.k===I.dist)?I.dist:d.dist,
    customKm:nNum(I.customKm,3,100,d.customKm),raceDate:nIso(I.raceDate,d.raceDate),weeks:Math.round(nNum(I.weeks,3,30,d.weeks)),
    curVol:opt(I.curVol,0,200),curLong:opt(I.curLong,0,45),recDist:["0","5","10","21.0975","42.195"].includes(String(I.recDist))?String(I.recDist):"0",
    recTime:nStr(I.recTime,12),runs:Math.round(nNum(I.runs,0,7,0)),
    days:Array.isArray(I.days)?[...new Set(I.days.map(Number).filter(x=>Number.isInteger(x)&&x>=0&&x<7))].sort((a,b)=>a-b):[],
    longDay:Math.round(nNum(I.longDay,-1,6,-1)),race:null};
  if(I.race&&typeof I.race==="object"&&nStr(I.race.name,200).trim())inputs.race={name:nStr(I.race.name,200).trim(),city:nStr(I.race.city,200).trim(),url:safeUrl(I.race.url)};
  const seenT=new Set(),types=[];
  for(const x of p.types){if(!x||typeof x!=="object")continue;let id=nId(x.id);if(!id||seenT.has(id))id="c"+uid();seenT.add(id);
    const kind=["easy","recovery","hard","long"].includes(x.kind)?x.kind:"hard";const ph=Array.isArray(x.phases)?PHASES.filter(q=>x.phases.includes(q)):[];
    types.push({id,name:nStr(x.name,80).trim()||t("ty_custom"),kind,on:id==="easy"||!!x.on,...(x.locked?{locked:true}:{}),phases:ph.length?ph:PHASES.slice(),tpl:nStr(x.tpl,2000)});}
  for(const def of DEFAULT_TYPES())if((def.id==="easy"||def.id==="long")&&!seenT.has(def.id))types.unshift({...def,on:def.id==="easy"});
  const weeks=[],seenS=new Set();
  for(const w of p.plan.weeks.slice(0,30)){
    if(!w||typeof w!=="object")return null;
    const start=nIso(w.start,weeks.length?iso(addDays(parseISO(weeks[weeks.length-1].start),7)):null);if(!start)return null;
    const sessions=[];
    for(const s of Array.isArray(w.sessions)?w.sessions.slice(0,14):[]){
      const day=+(s&&s.day);if(!Number.isInteger(day)||day<0||day>6)continue;
      let id=nId(s.id);if(!id||seenS.has(id))id=uid();seenS.add(id);
      const typeId=s.typeId==="race"?"race":nId(s.typeId)||"easy";const watch=nWatch(s.watch);
      sessions.push({id,day,typeId,name:nStr(s.name,80)||t("ty_easy"),kind:KINDS.includes(s.kind)?s.kind:"easy",km:Math.round(nNum(s.km,0,500,0)*100)/100,desc:nStr(s.desc,4000),note:nStr(s.note,4000),...(watch?{watch}:{})});
    }
    sessions.sort((a,b)=>a.day-b.day);
    weeks.push({n:weeks.length+1,phase:PHASES.includes(w.phase)?w.phase:"base",cutback:!!w.cutback,start,target:Math.round(nNum(w.target,0,2000,0)),note:nStr(w.note,4000),sessions});
  }
  if(!weeks.length)return null;
  const M=p.plan.meta&&typeof p.plan.meta==="object"?p.plan.meta:{};const vdot=nNum(M.vdot,15,90,null),raceSec=nNum(M.raceSec,60,86400,null);
  const meta={noRace:inputs.goal==="fitness",D:distKm(inputs),c:["5k","10k","hm","m"].includes(M.c)?M.c:cat(distKm(inputs)),taperN:Math.round(nNum(M.taperN,0,3,0)),
    peakV:Math.round(nNum(M.peakV,0,2000,0)),start:nIso(M.start,weeks[0].start),vdot,raceSec,racePace:vdot&&raceSec?nStr(M.racePace,16):null};
  return {name:nStr(p.name,120).trim()||t("trainingBlock"),inputs,types,plan:{weeks,meta},edited:!!p.edited,updatedAt:nNum(p.updatedAt,0,8.64e15,0)};
}
function snapshot(){return {name:S.name,inputs:S.inputs,types:S.types,plan:S.plan,edited:S.edited,updatedAt:Date.now()};}
function setStatus(t){$("#saveStatus").textContent=t;}
let saveTimer=null;
function markDirty(){S.dirty=true;if(S.savedAt){setStatus(t("unsaved"));clearTimeout(saveTimer);saveTimer=setTimeout(()=>{saveTimer=null;savePlan(true);},1500);}}
async function savePlan(auto){
  if(missingSetup(S.inputs).length){if(!auto)toast(t("needTitle"));return;}
  cancelSave();
  const data=snapshot();
  try{
    setStatus(t("saving"));
    {const all=lsAll();all[S.planId]=data;localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();}
    S.savedAt=Date.now();S.dirty=false;S.isExample=false;
    S.savedLbl=null;setStatus(t("savedLocal")+" · "+new Date().toLocaleTimeString(LOC(),{hour:"2-digit",minute:"2-digit"}));
    if(!auto){toast(t("planSaved"));renderPlan();}
  }catch(e){setStatus(t("notSaved"));toast(t("saveFail"));}
}
function lsAll(){try{return JSON.parse(localStorage.getItem("bb-plans")||"{}")||{};}catch(_){return {};}}
function refreshLocalList(){const all=lsAll();S.saved=Object.entries(all).filter(([id])=>nId(id)).map(([id,d])=>{const n=normalizeSaved(d);return n&&{id,...n};}).filter(Boolean).sort((a,b)=>b.updatedAt-a.updatedAt);}
/* autosave waits 1.5 s after the last change: write it now before anything replaces the current plan */
function flushSave(){if(!saveTimer)return;clearTimeout(saveTimer);saveTimer=null;if(S.savedAt&&S.dirty)savePlan(true);}
function cancelSave(){clearTimeout(saveTimer);saveTimer=null;}
addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flushSave();});
addEventListener("beforeunload",e=>{flushSave();if(S.dirty&&!S.savedAt&&!S.isExample&&!missingSetup(S.inputs).length){e.preventDefault();e.returnValue="";}});
function loadPlan(p){
  S.planId=p.id;S.name=p.name;S.nameAuto=false;S.inputs={...DEFAULT_INPUTS(),...JSON.parse(JSON.stringify(p.inputs))};S.types=JSON.parse(JSON.stringify(p.types));S.plan=JSON.parse(JSON.stringify(p.plan));S.edited=!!p.edited;S.savedAt=p.updatedAt;S.isExample=false;S.pendingRegen=false;S.dirty=false;
  $("#planName").value=S.name;renderSetup();renderPlan();setStatus(t("savedLocal")+" · "+new Date(p.updatedAt).toLocaleDateString(LOC(),{day:"numeric",month:"short"}));
}
function openPlans(){
  const list=S.saved;
  modal(`<h2>${t("myPlans")}</h2><p class="hint" style="margin:0">${t("localOnly")}</p>
  <div class="plans-list">${list.length?list.map(p=>`<div class="pl ${p.id===S.planId?"cur":""}"><div class="info"><b>${esc(p.name)}</b><span>${esc(cap(t(p.inputs&&p.inputs.goal==="fitness"?"planMetaFit":"planMeta",{lbl:p.inputs?distLabel(p.inputs):"",w:p.plan?p.plan.weeks.length:"?",d:p.inputs?fmtDate(parseISO(p.inputs.goal==="fitness"?(p.plan&&p.plan.meta.start||p.inputs.startDate):p.inputs.raceDate)):""})))}</span></div><button class="btn sm" data-open="${p.id}">${t("open")}</button><button class="btn sm ghost" data-delp="${p.id}">${t("del")}</button></div>`).join(""):`<p class="hint" style="margin:0">${t("noPlans")}</p>`}</div>
  <div class="actions"><button class="btn left" id="pImport">${t("importPlans")}</button><button class="btn" id="pExport" ${list.length?"":"disabled"}>${t("exportPlans")}</button><button class="btn" id="pClose">${t("close")}</button></div>`,m=>{
    m.querySelector("#pClose").onclick=closeModal;
    m.querySelector("#pExport").onclick=()=>{saveFile("block-builder-plans-"+iso(new Date())+".json",new Blob([JSON.stringify({app:"block-builder",version:1,plans:lsAll()},null,1)],{type:"application/json"}));};
    m.querySelector("#pImport").onclick=()=>{const inp=document.createElement("input");inp.type="file";inp.accept=".json,application/json";
      inp.onchange=async()=>{const f=inp.files&&inp.files[0];if(!f)return;
        try{const j=JSON.parse(await f.text());const src=j&&j.app==="block-builder"&&j.plans&&typeof j.plans==="object"?j.plans:null;if(!src)throw 0;
          const all=lsAll();let n=0;for(const [id,p] of Object.entries(src)){const c=normalizeSaved(p);if(c){all[nId(id)||uid()]=c;n++;}}
          if(!n)throw 0;localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();closeModal();toast(t("imported",{n}));openPlans();}
        catch(_){toast(t("importFail"));}};
      inp.click();};
    m.addEventListener("click",e=>{const o=e.target.closest("[data-open]"),d=e.target.closest("[data-delp]");
      if(o){flushSave();const p=S.saved.find(x=>x.id===o.dataset.open);closeModal();if(p)loadPlan(p);}
      if(d){const p=S.saved.find(x=>x.id===d.dataset.delp);closeModal();confirmBox(t("delQ"),t("delT",{name:p.name}),t("del"),async()=>{
        try{if(p.id===S.planId)cancelSave();{const all=lsAll();delete all[p.id];localStorage.setItem("bb-plans",JSON.stringify(all));refreshLocalList();}
          if(p.id===S.planId){S.savedAt=null;S.planId=uid();setStatus(t("notSaved"));}toast(t("deleted"));}catch(_){toast(t("delFail"));}});}
    });
  });
}
function newPlan(){
  flushSave();
  const go=()=>{S.nameAuto=true;S.inputs=BLANK_INPUTS();S.types=BLANK_TYPES();S.planId=uid();S.savedAt=null;S.isExample=false;S.dirty=false;S.pendingRegen=false;S.name=cap(t("blockName",{lbl:t("lhm")}));$("#planName").value=S.name;regen();renderSetup();renderPlan();setStatus(t("notSaved"));};
  if(S.dirty&&S.savedAt===null&&!S.isExample)confirmBox(t("newQ"),t("newT"),t("startNew"),go);else go();
}


/* ---------- header ---------- */
$("#planName").addEventListener("change",e=>{S.nameAuto=!e.target.value.trim();S.name=e.target.value.trim()||t("trainingBlock");e.target.value=S.name;markDirty();});
$("#btnSave").onclick=()=>savePlan(false);
function setTab(tab){document.body.dataset.tab=tab;document.querySelectorAll("#mtabs [data-tab]").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.tab===tab)));const L=$(".layout"),m=$("#mtabs");if(L&&m){const top=L.getBoundingClientRect().top;const h=m.offsetHeight+12;if(top<h)window.scrollTo({top:Math.max(0,top+scrollY-h)});}}
document.addEventListener("click",e=>{const b=e.target.closest("[data-tab],[data-tabgo]");if(b&&(b.closest("#mtabs")||b.dataset.tabgo))setTab(b.dataset.tab||b.dataset.tabgo);});
$("#btnPlans").onclick=openPlans;
$("#btnNew").onclick=newPlan;

function applyStatic(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>{el.textContent=t(el.dataset.i18n);});
  document.querySelectorAll("[data-i18n-html]").forEach(el=>{el.innerHTML=t(el.dataset.i18nHtml);});
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{el.placeholder=t(el.dataset.i18nPh);});
  document.querySelectorAll("[data-i18n-aria]").forEach(el=>{el.setAttribute("aria-label",t(el.dataset.i18nAria));});
  $("#langSel").value=LANG;
  syncTheme();
}
function syncTheme(){const v=document.documentElement.dataset.theme||"dark";document.querySelectorAll("#themeSeg [data-theme-v]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.themeV===v)));}
function setLang(l){
  if(l===LANG||!I18N[l])return;
  const prevName=defaultName();const from=LANG;LANG=l;try{localStorage.setItem("bb-lang",l);}catch(_){}
  DAYS=t("days").split("|");DAYS1=t("days1").split("|");
  translateTypes(S.types,from,l);
  if(S.name===prevName||S.name===I18N[from].trainingBlock){S.name=S.name===prevName?defaultName():t("trainingBlock");$("#planName").value=S.name;}
  if(S.edited){toast(t("langEdited"));}
  else{const wasDirty=S.dirty;regen();if(S.savedAt)markDirty();else S.dirty=wasDirty;}
  applyStatic();renderSetup();renderPlan();
  const st=$("#saveStatus");if(st&&!S.savedAt)setStatus(t("notSaved"));
}
$("#langSel").addEventListener("change",e=>setLang(e.target.value));
$("#themeSeg").addEventListener("click",e=>{const b=e.target.closest("[data-theme-v]");if(!b)return;const v=b.dataset.themeV;document.documentElement.dataset.theme=v;try{localStorage.setItem("bb-theme",v);}catch(_){}syncTheme();});
/* Display and language panel: opens from the gear, closes on Escape (focus back to the gear) or a tap outside */
function setPrefs(open,focusBack){const P=$("#prefsPanel"),B=$("#btnPrefs");P.hidden=!open;B.setAttribute("aria-expanded",String(open));
  if(open)(P.querySelector('[aria-pressed="true"]')||P.querySelector("button,select")).focus({preventScroll:true});else if(focusBack)B.focus({preventScroll:true});}
$("#btnPrefs").addEventListener("click",()=>setPrefs($("#prefsPanel").hidden));
$("#prefs").addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#prefsPanel").hidden){e.stopPropagation();setPrefs(false,true);}});
$("#prefs").addEventListener("focusout",e=>{if(e.relatedTarget&&!$("#prefs").contains(e.relatedTarget))setPrefs(false);});
document.addEventListener("click",e=>{if(!$("#prefsPanel").hidden&&!e.target.closest("#prefs"))setPrefs(false);});

applyStatic();
regen();renderSetup();$("#planName").value=S.name;renderPlan();setStatus(t("notSaved"));
refreshLocalList();
})();
</script>
