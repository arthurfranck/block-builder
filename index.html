<style>
/* Layout: sticky setup rail on the left, plan on the right (volume profile, then week x day grid). Stacks on phones. */
:root{
  /* "Night track": dark is the default. Volt accent only on today's run and the primary action. */
  --bg:#0B0F10; --surface:#131A1C; --surface-2:#1B2427; --ink:#ECF1EE; --muted:#97A5A8; --line:#283336;
  --accent:#D4FF3A; --accent-ink:#0B0F10; --accent-btn:#D4FF3A; --accent-line:#D4FF3A;
  --recovery:#7FA6C9; --easy:#4CB98F; --long:#DDBF4F; --tempo:#F0894A; --hard:#EC5A6E; --race:#D879D2;
  --ph-base:#5E8C7C; --ph-build:#5579AE; --ph-peak:#EE7650; --ph-taper:#C9A447; --ph-recovery:#8AA4AE;
  --recovery-t:#7FA6C9; --easy-t:#4CB98F; --long-t:#DDBF4F; --tempo-t:#F0894A; --hard-t:#EC5A6E; --race-t:#D879D2;
  --ph-base-t:#6A9A89; --ph-build-t:#7392C2; --ph-peak-t:#EE7650; --ph-taper-t:#C9A447; --ph-recovery-t:#9DB5BE;
  --warn-bg:#33270F; --warn-ink:#F2CD86; color-scheme:dark;
  /* surfaces: page --bg, cards --surface, things inside cards --surface-2; only Today gets --lift */
  --lift:0 14px 36px rgba(0,0,0,.45);
  --f-display:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; /* expanded (font-stretch:125%) and heavy: brand and hero numbers only */
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular",Menlo,monospace; /* system font, code samples only */
}
/* Light theme: chosen in the header, or "Auto" on a device set to light. Volt fails as text on light, so lines use olive. */
:root[data-theme="light"]{
  --bg:#E8EDEB; --surface:#FFFFFF; --surface-2:#F0F4F2; --ink:#142027; --muted:#5A6A6F; --line:#D5DDDB;
  --accent:#D4FF3A; --accent-ink:#142027; --accent-btn:#D4FF3A; --accent-line:#557000;
  --recovery:#4F7EAB; --easy:#2B8768; --long:#9E7C08; --tempo:#C65B1F; --hard:#C9405A; --race:#B04BA8;
  --ph-base:#8FB2A5; --ph-build:#6C93C8; --ph-peak:#D4542C; --ph-taper:#C9A447; --ph-recovery:#8AA4AE;
  --warn-bg:#FFF4E5; --warn-ink:#7A4A00;
  --recovery-t:#3B6690; --easy-t:#21735A; --long-t:#75620A; --tempo-t:#A9501A; --hard-t:#B3324A; --race-t:#97368F;
  --ph-base-t:#557C6D; --ph-build-t:#4575B7; --ph-peak-t:#C44D28; --ph-taper-t:#8B6F29; --ph-recovery-t:#4F6B75; --lift:0 10px 28px rgba(20,32,39,.13); color-scheme:light}
@media (prefers-color-scheme: light){:root[data-theme="auto"]{
  --bg:#E8EDEB; --surface:#FFFFFF; --surface-2:#F0F4F2; --ink:#142027; --muted:#5A6A6F; --line:#D5DDDB;
  --accent:#D4FF3A; --accent-ink:#142027; --accent-btn:#D4FF3A; --accent-line:#557000;
  --recovery:#4F7EAB; --easy:#2B8768; --long:#9E7C08; --tempo:#C65B1F; --hard:#C9405A; --race:#B04BA8;
  --ph-base:#8FB2A5; --ph-build:#6C93C8; --ph-peak:#D4542C; --ph-taper:#C9A447; --ph-recovery:#8AA4AE;
  --warn-bg:#FFF4E5; --warn-ink:#7A4A00;
  --recovery-t:#3B6690; --easy-t:#21735A; --long-t:#75620A; --tempo-t:#A9501A; --hard-t:#B3324A; --race-t:#97368F;
  --ph-base-t:#557C6D; --ph-build-t:#4575B7; --ph-peak-t:#C44D28; --ph-taper-t:#8B6F29; --ph-recovery-t:#4F6B75; --lift:0 10px 28px rgba(20,32,39,.13); color-scheme:light}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:18px}
.brand{margin:0;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:24px;letter-spacing:-.01em;line-height:1;display:flex;align-items:center;gap:10px}
.brand .lanes{display:inline-grid;grid-template-rows:repeat(3,4px);gap:3px;width:26px}

.brand .lanes i:nth-child(2){width:80%}.brand .lanes i:nth-child(3){width:55%}
.top .spacer{flex:1}
.lang-sel{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 8px;font-size:13.5px;font-weight:600;cursor:pointer}
.lang-sel:hover{border-color:var(--ink)}
/* Display and language: secondary settings behind one icon at the end of the header (BB-61) */
.prefs{position:relative}
.icon-btn{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--ink);padding:0}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{border-color:var(--ink)}

.prefs-panel{position:absolute;right:0;top:calc(100% + 6px);z-index:30;width:240px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:0 12px 30px rgba(0,0,0,.35);display:grid;gap:6px}
.prefs-lbl{font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

@media (pointer:coarse){.lang-sel{font-size:16px}}
.hello{display:flex;align-items:center;gap:16px;padding-block:2px 14px}

.hello h1{margin:0;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:clamp(28px,4.6vw,44px);line-height:1;letter-spacing:-.015em;text-wrap:balance}
.hello h1 span{color:var(--muted)}

.hello p b{color:var(--ink);font-weight:600}
.hello .txt{min-width:0;flex:1}
.countdown{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--surface);border-radius:10px;padding:10px 14px;max-width:100%;min-width:0}
.countdown .num{grid-row:1/3;font-family:var(--f-display);font-stretch:125%;font-weight:800;font-size:42px;line-height:.9;color:var(--ink);font-variant-numeric:tabular-nums}
.countdown .num small{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center}
.countdown .rn{font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere;color:var(--ink);text-decoration:none}
.countdown a.rn:hover{text-decoration:underline}
.countdown .rm{font-size:13px;color:var(--muted)}
@media (max-width:640px){.hello{flex-wrap:wrap}.countdown{flex-basis:100%}}
/* phone: Plan / Settings tabs, compact header, 16px fields to stop iOS focus zoom */
.mtabs,.m-only,.mbar,.sheet-head{display:none}
@media (max-width:900px){
  .mtabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:-4px 0 12px;border-bottom:1px solid var(--line)}
  .mtabs button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:9px;font-weight:600;cursor:pointer;min-height:40px}
  .mtabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  body[data-tab="plan"] aside.setup{display:none}
  body[data-tab="setup"] main.plan{display:none}

}
@media (max-width:640px){
  header.top{gap:10px 8px;padding-bottom:10px;margin-bottom:12px}
  .brand{font-size:24px;flex:1 1 auto}
  .prefs{order:1}
  .plan-name{order:2}
  #btnPlans{order:2}
  #saveStatus{order:3}
  .top .btn{order:4}
  .top .spacer{order:3;flex-basis:100%;height:0} /* BB-32: buttons on their own line */
  .plan-name{flex:0 1 auto;max-width:calc(100% - 120px);font-size:18px;padding-left:0}
  .top .btn{padding:7px 10px}
  #btnSave{margin-left:auto}
  .hello p.lead{font-size:15.5px}
}
@media (pointer:coarse){input,select,textarea,.type-head .tname{font-size:16px}}

.racebox{border:1px dashed var(--line);border-radius:8px;padding:10px;display:grid;gap:8px}
.racebox.set{border-color:transparent;background:var(--surface)}
.racebox .acts{display:flex;flex-wrap:wrap;gap:6px}
/* BB-32: plan switcher right after the name */
.top .switch{margin-left:-16px}
.plan-name{text-overflow:ellipsis;font-family:var(--f-body);font-size:18px;font-weight:600;border:1px solid transparent;background:transparent;padding:2px 6px;border-radius:4px;min-width:0;width:min(320px,60vw)}
.plan-name:hover,.plan-name:focus{border-color:var(--line);background:var(--surface)}
.status{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 13px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;white-space:nowrap}
a.btn{text-decoration:none;display:inline-block;color:var(--ink)}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent-btn);color:var(--accent-ink);border-color:var(--accent-line)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 9px;font-size:13px}
.layout{display:grid;grid-template-columns:minmax(300px,370px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
aside.setup{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;padding-right:4px}
@media (max-width:900px){aside.setup{position:static;max-height:none;overflow:visible}}
/* BB-29: on phones, once the plan is complete, the tabs give way to the plan (Today first) and an Edit plan button;
   the settings open as a bottom sheet over it. A new plan's steps and an incomplete setup keep the full-page settings. */
@media (max-width:900px){
  body.planmode .mtabs{display:none}
  body.planmode .mbar{display:block;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0;margin:-4px 0 12px;border-bottom:1px solid var(--line)}
  body.planmode .mbar .btn{width:100%;min-height:44px}
  body.planmode main.plan{display:block}
  body.planmode aside.setup{display:none}
  body.planmode .see-plan{display:none}
  body.planmode.sheet{overflow:hidden}
  body.planmode.sheet .sheet-bg{display:block;position:fixed;inset:0;background:rgb(0 0 0 / .42);z-index:55}
  body.planmode.sheet aside.setup{display:block;position:fixed;top:auto;left:0;right:0;bottom:0;z-index:60;max-height:calc(100vh - 24px);overflow:auto;overscroll-behavior:contain;
    background:var(--bg);border-radius:16px 16px 0 0;border-top:1px solid var(--line);padding:0 16px max(18px,env(safe-area-inset-bottom,0px))}
  @supports (height:100dvh){body.planmode.sheet aside.setup{max-height:calc(100dvh - 24px)}}
  body.planmode.sheet aside.setup:focus{outline:none}
  body.planmode.sheet .sheet-head{display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:2;background:var(--bg);padding:18px 0 10px;margin-bottom:4px;border-bottom:1px solid var(--line)}
  body.planmode.sheet .sheet-head h2{flex:1;margin:0;font-family:var(--f-body);font-size:19px;font-weight:600}

.sec{padding-block:16px;display:grid;gap:10px}
.sec:first-child{border-top:0;padding-top:0}
.sec h3{margin:0;font-family:var(--f-body);font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.row.top{align-items:start} /* BB-71: the volume hint must not stretch the field beside it */
/* iOS WebKit gives date inputs an intrinsic min width that overflows grid cells */
.field input[type=date]{-webkit-appearance:none;appearance:none;max-width:100%;min-height:36px}

.field{display:grid;gap:4px;min-width:0}

.kind-dot{width:10px;height:10px;border-radius:50%;flex:none}

.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);border-radius:999px;padding:2px 9px;font-size:12px;cursor:pointer;background:var(--surface)}

.icon-btn{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:13px;padding:2px 4px}

.banner.info{background:var(--surface-2);color:var(--ink)}

    <button class="btn primary" id="btnSave" data-i18n="keepPlan" hidden>Keep this plan</button>

      <button type="button" class="icon-btn" id="btnPrefs" aria-expanded="false" aria-controls="prefsPanel" data-i18n-aria="prefs"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      <div class="prefs-panel" id="prefsPanel" role="group" data-i18n-aria="prefs" hidden>
        <span class="prefs-lbl" id="themeLbl" data-i18n="theme">Theme</span>
        <div class="seg" id="themeSeg" role="group" aria-labelledby="themeLbl"><button type="button" data-theme-v="dark" data-i18n="thDark">Dark</button><button type="button" data-theme-v="light" data-i18n="thLight">Light</button><button type="button" data-theme-v="auto" data-i18n="thAuto">Auto</button></div>
        <p class="prefs-hint" data-i18n="thHint">Auto follows your device.</p>
        <label class="prefs-lbl" for="langSel" data-i18n="language">Language</label>
        <select class="lang-sel" id="langSel"><option value="en" lang="en">English</option><option value="fr" lang="fr">Français</option></select>
      </div>
    </div>
  </header>

  <div class="mtabs" role="tablist" id="mtabs"><button type="button" role="tab" data-tab="plan" aria-selected="true" data-i18n="tabPlan">Plan</button><button type="button" role="tab" data-tab="setup" aria-selected="false" data-i18n="tabSetup">Settings</button></div>
  <div class="mbar" id="mbar"><button type="button" class="btn" id="btnEditPlan" aria-haspopup="dialog" data-i18n="editPlan">Edit plan</button></div>
  <div class="sheet-bg" id="sheetBg" hidden></div>
  <div class="layout">
    <aside class="setup" id="setup">
      <div class="sheet-head"><h2 id="sheetTitle" data-i18n="editPlan">Edit plan</h2><button type="button" class="btn primary" id="btnSheetDone" data-i18n="done">Done</button></div>
      <section class="sec" data-step="1">
        <h3 data-i18n="secGoal">Goal</h3>
        <div class="icards" id="introCards"></div>
        <div class="seg" id="goalSeg" role="group" data-i18n-aria="secGoal"><button type="button" data-goal="race" data-i18n="goalRace">Train for a race</button><button type="button" data-goal="fitness" data-i18n="goalFit">Personal plan</button></div>
        <div class="goalquick"><span data-i18n="qwEmpty">Just want one session?</span><button type="button" class="btn sm ghost" id="btnQuickGoal"><span data-i18n="qwOpen">Quick workout</span></button></div>
      </section>

      <section class="sec" data-step="2">
        <h3 id="secRaceH">Race</h3>
        <div class="field"><span class="lbl" id="distLbl">Distance</span>
          <div class="seg" id="distSeg"></div>
        </div>
        <div class="row" id="customRow" hidden>
          <div class="field"><label for="customKm" data-i18n="customKm">Custom distance (km)</label><input id="customKm" type="number" min="3" max="100" step="0.1"></div>
        </div>
        <div class="row top">
          <div class="field" id="raceDateF"><label for="raceDate" data-i18n="raceDate">Race date</label><input id="raceDate" type="date" aria-describedby="fw-date"></div>
          <div class="field" id="startDateF" hidden><label for="startDate" data-i18n="startDate">Start date</label><input id="startDate" type="date" aria-describedby="fw-date"></div>
          <div class="field"><label for="weeks" data-i18n="weeks">Weeks of training</label><input id="weeks" type="number" min="3" max="30" aria-describedby="fw-weeks"><div class="fwarn" id="fw-weeks" hidden></div></div>
        </div>
        <div class="fwarn" id="fw-date" hidden></div>
        <div class="hint" id="startHint"></div>
        <div class="hint" id="focusHint" hidden></div>
        <div class="field" id="recWeeksF"><span class="lbl" id="recWeeksLbl" data-i18n="recWeeks">Recovery after the race</span><div class="seg" id="recSeg" role="group" aria-labelledby="recWeeksLbl"></div><div class="hint" id="recHint"></div></div>
        <div class="racebox" id="raceBox"></div>
      </section>

      <section class="sec" data-step="3">
        <h3 data-i18n="secNow">Your running now</h3>
        <div class="field"><span class="lbl" id="levelLbl" data-i18n="level">Experience</span><div class="seg" id="levelSeg" role="group" aria-labelledby="levelLbl"></div><div class="hint" id="levelHint"></div></div>
        <div class="row top">
          <div class="field"><label for="curVol" data-i18n="curVol">Weekly volume (km)</label><input id="curVol" type="number" min="5" max="200" aria-describedby="volHint fw-curVol"><div class="hint" id="volHint" data-i18n="volHint" hidden></div><div class="fwarn" id="fw-curVol" hidden></div></div>
          <div class="field"><label for="curLong" data-i18n="curLong">Longest recent run (km, optional)</label><input id="curLong" type="number" min="3" max="45" aria-describedby="fw-curLong"><div class="fwarn" id="fw-curLong" hidden></div></div>
        </div>
        <div class="row">
          <div class="field"><label for="recDist" data-i18n="recDist">Recent race</label>
            <select id="recDist"><option value="0" data-i18n="none">None</option><option value="5" data-i18n="l5k">5K</option><option value="10" data-i18n="l10k">10K</option><option value="21.0975" data-i18n="halfMarathon">Half marathon</option><option value="42.195" data-i18n="marathon">Marathon</option></select>
          </div>
          <div class="field"><label for="recTime" data-i18n="recTime">Finish time</label><input id="recTime" data-i18n-ph="recTimePh" inputmode="numeric"></div>
        </div>
        <div class="hint" id="paceHint"></div>
      </section>

      <section class="sec" data-step="4">
        <h3 data-i18n="secWeek">Week shape</h3>
        <div class="field"><span class="lbl" id="runsLbl" data-i18n="runsPerWeek">Runs per week</span><div class="seg" id="runsSeg" role="group" aria-labelledby="runsLbl" aria-describedby="fw-runs"></div><div class="fwarn" id="fw-runs" hidden></div></div>
        <div class="field"><span class="lbl" id="daysLbl"><span data-i18n="runningDays">Running days</span> <span id="daysCount"></span></span><div class="seg days" id="daysSeg" role="group" aria-labelledby="daysLbl" aria-describedby="fw-days"></div><div class="fwarn" id="fw-days" hidden></div></div>
        <div class="field"><label for="longDay" data-i18n="longDay">Long run day</label>
          <select id="longDay" aria-describedby="fw-longDay"></select><div class="fwarn" id="fw-longDay" hidden></div></div>
      </section>

      <section class="sec" data-step="4">
        <h3 data-i18n="secTypes">Run types</h3>
        <div class="hint" id="typesCount"></div>
        <div class="fwarn" id="fw-types" hidden></div>
        <div class="tgroups" id="typeChips" aria-describedby="fw-types"></div>
        <details class="customise" id="typesMore">
          <summary><span class="cust-t" data-i18n="customise">Customise workouts</span><span class="cust-s" data-i18n="customiseSub">Phases, descriptions, add your own</span></summary>
          <div class="cust-body">
            <div class="hint" data-i18n-html="typesHint"></div>
            <div class="types" id="types"></div>
            <button class="btn sm" id="btnAddType" data-i18n="addType">Add run type</button>
          </div>
        </details>
      </section>
      <div class="intro" id="introNav" hidden></div>
      <button class="btn primary see-plan m-only" type="button" data-tabgo="plan" data-i18n="seePlan">See the plan</button>
    </aside>

    <main class="plan" id="plan"></main>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toastRoot" role="status" aria-live="polite"></div>
<footer class="ver" id="appVersion"></footer>

<!-- BB-74: ?v= is the app version, so a new release never runs with a cached older script (Pages caches files for 10 min) -->
<script src="app.js?v=1.13.3"></script>

</body></html>
